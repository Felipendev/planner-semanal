<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbfaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
:root{
  --paper:#fbfaf8; --surface:#fff; --sunken:#f4f2ee;
  --ink:#1b1a18; --ink2:#56534d; --ink3:#8d8a83; --ink4:#b5b1a8;
  --line:#e6e3dc; --line2:#f0eee9;
  --accent:#1f5f4e; --accent-soft:#e8f0ed;
  --now:#b4432e; --warn:#96702a; --good:#1f5f4e; --gold:#a8791b; --quoteink:#5c410c;
  --hour:110px; --radius:5px;
  --hm0:#ebedf0; --hm1:#9be9a8; --hm2:#40c463; --hm3:#30a14e; --hm4:#216e39;
}

:root[data-theme="dark"]{
  --paper:#141414; --surface:#1a1a19; --sunken:#212120;
  --ink:#eceae5; --ink2:#a8a49c; --ink3:#7a766e; --ink4:#565350;
  --line:#2b2b29; --line2:#232322;
  --accent:#6bbfa4; --accent-soft:#1d2a26;
  --now:#d9705a; --warn:#c9a253; --good:#6bbfa4; --gold:#d8ad4d; --quoteink:#f0dfae;
  --hm0:#20211f; --hm1:#0e4429; --hm2:#006d32; --hm3:#26a641; --hm4:#39d353;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --paper:#141414; --surface:#1a1a19; --sunken:#212120;
    --ink:#eceae5; --ink2:#a8a49c; --ink3:#7a766e; --ink4:#565350;
    --line:#2b2b29; --line2:#232322;
    --accent:#6bbfa4; --accent-soft:#1d2a26;
    --now:#d9705a; --warn:#c9a253; --good:#6bbfa4; --gold:#d8ad4d; --quoteink:#f0dfae;
    --hm0:#20211f; --hm1:#0e4429; --hm2:#006d32; --hm3:#26a641; --hm4:#39d353;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  font-feature-settings:"tnum" 1,"cv05" 1; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;}
button{font:inherit;color:inherit;}
.num{font-variant-numeric:tabular-nums;}

/* buttons */
.b{background:none;border:1px solid transparent;color:var(--ink2);padding:5px 9px;
   border-radius:var(--radius);font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s;}
.b:hover{background:var(--sunken);color:var(--ink);}
.b.line{border-color:var(--line);background:var(--surface);}
.b.line:hover{border-color:var(--ink4);}
.b.solid{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.b.solid:hover{opacity:.86;background:var(--ink);}
.b.on{background:var(--sunken);color:var(--ink);font-weight:550;}
.b.sm{padding:3px 7px;font-size:12px;}
.b.xs{padding:1px 5px;font-size:11px;}
.b.danger{color:var(--now);}
.icon{padding:5px 7px;font-size:15px;line-height:1;}

/* inputs */
input,select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius);padding:7px 9px;font:inherit;font-size:13px;transition:.12s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
input[type=checkbox]{width:auto;}
.fld{display:block;margin-bottom:11px;}
.fld>span{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:550;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* ── top bar ───────────────────────────────────────── */
.top{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;}
.top .mark{font-size:14px;font-weight:600;letter-spacing:-.02em;}
.top .mark em{font-style:normal;color:var(--ink3);font-weight:400;}
.period{font-size:14px;font-weight:550;min-width:170px;letter-spacing:-.01em;}
.seg{display:flex;gap:1px;background:var(--sunken);padding:2px;border-radius:6px;}
.seg .b{padding:4px 11px;font-size:12.5px;border-radius:4px;}
.seg .b.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05);}
.grow{flex:1;}
.stat{display:flex;align-items:baseline;gap:5px;font-size:12.5px;color:var(--ink3);}
.stat b{font-size:14px;color:var(--ink);font-weight:600;}
.chipbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:20px;padding:4px 11px 4px 9px;font-size:11.5px;color:var(--ink2);cursor:pointer;
  white-space:nowrap;transition:.12s;}
.chipbtn:hover{border-color:var(--ink4);color:var(--ink);}
.chipbtn i{width:7px;height:7px;border-radius:50%;background:var(--ink4);flex:none;}
.chipbtn.ok i{background:var(--good);}
.chipbtn.warn i{background:var(--warn);}
.chipbtn.bad i{background:var(--now);}
.chipbtn.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));}
.chipbtn.bad{border-color:color-mix(in srgb,var(--now) 45%,var(--line));}
.chipbtn.pisca{animation:pulsa 2s ease-in-out infinite;}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}
  50%{box-shadow:0 0 0 5px transparent}}
@media(max-width:900px){ .chipbtn span{display:none;} .chipbtn{padding:6px;} }

/* ── shell ─────────────────────────────────────────── */
.shell{display:flex;height:calc(100vh - 52px);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.side{width:300px;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);
  overflow-y:auto;padding:18px 16px 40px;}
@media(max-width:1080px){ .side{display:none;} .side.show{display:block;position:fixed;right:0;top:52px;bottom:0;z-index:60;box-shadow:-8px 0 30px rgba(0,0,0,.12);} }

/* ── week grid ─────────────────────────────────────── */
.wkwrap{min-width:730px;}
.stick{position:sticky;top:0;z-index:25;background:var(--surface);box-shadow:0 1px 0 var(--line);}
.wkhead{display:grid;background:var(--surface);}
.wkhead .gut{border-right:1px solid var(--line);}
.dh{border-right:1px solid var(--line);padding:8px 8px 7px;min-width:0;}
.dh .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;}
.dh .dnum{font-size:19px;font-weight:500;letter-spacing:-.02em;margin-top:1px;}
.dh.today .dow{color:var(--accent);}
.dh.today .dnum{color:var(--accent);font-weight:650;}
.dh.past{opacity:.5;}
.dh .sub{font-size:10.5px;color:var(--ink3);margin-top:2px;display:flex;gap:5px;align-items:center;}
.dh .sub{justify-content:space-between;}
.plb{border:1px solid var(--line);background:var(--surface);color:var(--ink3);
  font-size:9.5px;font-weight:700;padding:0 4px;border-radius:3px;cursor:pointer;line-height:14px;}
.plb:hover{border-color:var(--ink4);color:var(--ink);}
.plb.alt{background:var(--warn);border-color:var(--warn);color:#fff;}
.dh .pd{display:flex;gap:3px;margin-top:5px;}
.pdot{width:100%;height:3px;border-radius:2px;background:var(--line);cursor:pointer;transition:.12s;}
.pdot:hover{background:var(--ink4);}
.pdot.off{background:var(--now);}

.allday{display:grid;border-top:1px solid var(--line2);background:var(--surface);}
.allday .gut{border-right:1px solid var(--line);}
.allday .c{border-right:1px solid var(--line);padding:3px 4px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.adc{font-size:10.5px;padding:2px 6px;border-radius:3px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;}

.scroll{flex:1;overflow:auto;}
.wk{display:grid;position:relative;}
.gut{position:relative;}
.gut .hl{position:absolute;right:7px;font-size:10.5px;color:var(--ink3);transform:translateY(-50%);
  font-variant-numeric:tabular-nums;}
.dc{border-right:1px solid var(--line);position:relative;min-width:0;}
.dc .ln{position:absolute;left:0;right:0;border-top:1px solid var(--line2);}
.dc.today{background:var(--accent-soft);}
.dc.wknd{background:color-mix(in srgb,var(--sunken) 55%,transparent);}
.sleep{position:absolute;left:0;right:0;background:repeating-linear-gradient(
  -45deg,transparent,transparent 5px,color-mix(in srgb,var(--ink4) 14%,transparent) 5px,color-mix(in srgb,var(--ink4) 14%,transparent) 6px);}
.offb{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--now) 9%,transparent);
  border-top:1px solid color-mix(in srgb,var(--now) 40%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--now) 40%,transparent);pointer-events:none;}

/* ── blocos da agenda ───────────────────────────────────
   Três densidades. Bloco alto mostra o horário numa segunda
   linha; blocos curtos põem o horário ao lado do título,
   como no Google Agenda.                                  */
.ev{position:absolute;border-radius:5px;padding:6px 28px 6px 10px;overflow:hidden;cursor:pointer;
  font-size:12.5px;line-height:1.36;border-left:3px solid;transition:.1s;}
.ev:hover{filter:brightness(.96);z-index:30!important;box-shadow:0 1px 6px rgba(0,0,0,.12);}
.ev .et{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;}
.ev .eh{font-size:10px;opacity:.7;font-variant-numeric:tabular-nums;display:block;}
.ev .ei{opacity:.6;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:0;}
.ev.done{opacity:.42;}
.ev.done .et{text-decoration:line-through;}
.ev.fx{border-left-style:solid;border-left-width:2.5px;}
.ev.fx::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-45deg,transparent,transparent 4px,rgba(0,0,0,.025) 4px,rgba(0,0,0,.025) 5px);}

/* médio: uma linha, checkbox de 13px centralizado */
.ev.mini{padding:0 22px 0 8px;display:flex;align-items:center;}
.ev.mini .et{font-size:11px;line-height:1.12;font-weight:500;white-space:nowrap;letter-spacing:-.012em;}
.ev.mini .eh{display:none;}
.ev.mini .ck{width:13px;height:13px;right:5px;}
.ev.mini.oh{padding-right:8px;}

/* curto: caixa de 11px, fonte menor, tudo numa linha */
.ev.tiny{padding:0 16px 0 7px;display:flex;align-items:center;}
.ev.tiny .et{font-size:9.5px;line-height:1.05;letter-spacing:-.016em;white-space:nowrap;}
.ev.tiny .ei{opacity:.55;}
.ev.tiny .ck{width:11px;height:11px;right:3px;}
.ev.tiny.oh{padding-right:7px;}

/* apoio: ocupa tempo, não é tarefa */
.ev.oh{padding-right:10px;opacity:.7;font-style:italic;}
.ev.oh .et{font-weight:450;}

/* checkbox centralizado na altura, com alvo de clique folgado */
.ck{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  opacity:.5;cursor:pointer;accent-color:var(--accent);margin:0;}
.ck::after{content:'';position:absolute;inset:-6px;}
.ev:hover .ck{opacity:.95;}
.ev.done .ck{opacity:.8;}
.bell{font-size:9px;opacity:.6;}
.bell{font-size:9px;opacity:.6;}

.nowl{position:absolute;left:0;right:0;border-top:1.5px solid var(--now);z-index:40;pointer-events:none;}
.nowl::before{content:'';position:absolute;left:0;top:-3.5px;width:6px;height:6px;border-radius:50%;background:var(--now);}
.nowt{position:absolute;z-index:41;font-size:10px;color:var(--now);font-weight:600;
  transform:translateY(-50%);right:7px;background:var(--paper);padding:0 2px;font-variant-numeric:tabular-nums;}

/* ── month ─────────────────────────────────────────── */
.mo{padding:28px 34px 60px;overflow-y:auto;flex:1;}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);
  border-radius:7px;overflow:hidden;background:var(--surface);}
.mh{padding:7px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
.mh:nth-child(7n){border-right:none;}
.mc{min-height:98px;padding:5px 7px 7px;border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.mc:nth-child(7n){border-right:none;}
.mc:hover{background:var(--sunken);}
.mc.out{opacity:.32;}
.mc .mn{font-size:12px;font-weight:550;font-variant-numeric:tabular-nums;}
.mc.today .mn{background:var(--accent);color:#fff;border-radius:50%;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.mc .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.mc .mr{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.mch{font-size:10px;padding:1px 5px;border-radius:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-weight:550;}
.mdots{display:flex;gap:2.5px;margin-top:auto;padding-top:3px;}
.mdt{width:5px;height:5px;border-radius:50%;flex:none;}

/* ── agenda ────────────────────────────────────────── */
.ag{padding:6px 22px 40px;overflow-y:auto;flex:1;max-width:760px;}
.agd{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2);}
.agd .dl{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding-top:3px;}
.agd .dl b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em;
  text-transform:none;font-weight:500;font-variant-numeric:tabular-nums;}
.agd.istoday .dl b{color:var(--accent);}
.agi{display:flex;gap:11px;align-items:baseline;padding:4px 0;cursor:pointer;font-size:13.5px;}
.agi:hover{color:var(--accent);}
.agi .at{color:var(--ink3);font-size:12px;min-width:88px;font-variant-numeric:tabular-nums;}
.agi .ad{width:6px;height:6px;border-radius:50%;flex-shrink:0;align-self:center;}

/* ── protocolo 180 ─────────────────────────────────── */
.protobox{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:20px 22px;margin-bottom:18px;}
.proto{padding:28px 34px 70px;overflow-y:auto;flex:1;}
.proto .wrap{max-width:none;}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px;}
.protobox h1{font-size:27px;letter-spacing:-.035em;margin:4px 0 3px;font-weight:600;}
.psub{font-size:12.5px;color:var(--ink3);}
.pkpi{display:flex;gap:24px;}
.pkpi>div{text-align:right;}
.pkpi span{font-size:24px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1;}
.pkpi small{font-size:10.5px;color:var(--ink3);display:block;margin-top:4px;}

.pgridwrap{padding-bottom:6px;margin-bottom:14px;min-width:0;}
.pgrid{display:grid;grid-template-columns:repeat(30,1fr);gap:6px;width:100%;}
@media(max-width:900px){ .pgridwrap{overflow-x:auto;} .pgrid{grid-template-columns:repeat(30,20px);width:max-content;} }
.pq{width:100%;aspect-ratio:1;height:auto;border-radius:5px;position:relative;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;transition:.1s;}
.pq span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--ink4);font-variant-numeric:tabular-nums;}
.pq:hover{transform:scale(1.22);z-index:5;border-color:var(--ink);}
.pq.futuro{background:var(--surface);border-style:dashed;}
.pq.futuro span{opacity:.55;}
.pq.ok,.pq.fraco{background:var(--f);border-color:transparent;}
.pq.ok span,.pq.fraco span{color:rgba(255,255,255,.9);font-weight:600;}
.pq.fraco{opacity:.62;}
.pq.vazio{background:var(--sunken);}
.pq.vazio::after,.pq.vazio::before{content:'';position:absolute;left:3px;right:3px;top:50%;
  height:1.5px;background:var(--ink4);opacity:.7;}
.pq.vazio::after{transform:rotate(45deg);} .pq.vazio::before{transform:rotate(-45deg);}
.pq.vazio span{display:none;}
.pq.folga{background:repeating-linear-gradient(-45deg,transparent,transparent 3px,var(--line) 3px,var(--line) 5px);}
.pq.folga span{display:none;}
.pq.hoje{border:2px solid var(--now);background:var(--surface);}
.pq.hoje span{color:var(--now);font-weight:700;}
.pq.marco{box-shadow:2px 0 0 var(--ink4);}
.pleg{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink3);margin:0;}
.pleg span{display:flex;align-items:center;gap:5px;}
.pleg i.pq{width:15px;height:15px;aspect-ratio:auto;flex:none;cursor:default;}
.pleg i.pq:hover{transform:none;}

.ptab{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.card2.full{margin-bottom:20px;}
.ph2,.prow{display:grid;gap:14px;padding:11px 15px;background:var(--surface);align-items:center;}
.ptab.proj .ph2,.ptab.proj .prow{grid-template-columns:minmax(140px,1.6fr) 64px 100px 122px minmax(96px,.8fr);}
.ptab.meta .ph2,.ptab.meta .prow{grid-template-columns:minmax(140px,1.4fr) 104px 128px minmax(150px,1.5fr);}
.ph2{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  font-weight:600;line-height:1.3;}
.ph2 span:not(:first-child){text-align:right;}
.ph2 .lft,.prow .lft{text-align:left;}
.prow .lft{color:var(--ink3);font-size:11.5px;}
.pn2{font-size:12.5px;font-weight:550;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.pn2 i{width:8px;height:8px;border-radius:50%;flex:none;}
.pn2 small{display:block;width:100%;font-size:10.5px;color:var(--ink3);font-weight:400;padding-left:15px;}
.pv{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;}
.pv.alt{color:var(--ink2);}
.pv.strong{font-weight:700;font-size:15px;}
.pbar2{position:relative;height:5px;background:var(--sunken);border-radius:3px;}
.pbar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;}
.pbar2 b{position:absolute;top:-3px;width:2.5px;height:11px;border-radius:2px;transform:translateX(-50%);}
.pgap{font-size:11.5px;color:var(--ink3);text-align:left;}
.pgap b{color:var(--warn);font-weight:700;}
.prow.tot{background:var(--sunken);font-weight:600;}
@media(max-width:820px){
  .ptab.proj .ph2,.ptab.proj .prow{grid-template-columns:1fr 56px 82px 96px;}
  .ptab.proj .pbar2,.ptab.proj .ph2 span:last-child{display:none;}
  .ptab.meta .ph2,.ptab.meta .prow{grid-template-columns:1fr 84px 104px;}
  .ptab.meta .lft{display:none;}
}

.marcos{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;}
.marco2{border:1px solid var(--line);border-radius:8px;padding:11px 12px;opacity:.5;}
.marco2.on{opacity:1;border-color:var(--accent);}
.mt{font-size:13px;font-weight:600;}
.mdd{font-size:11px;color:var(--ink3);}
.mp{font-size:11px;color:var(--ink2);margin:6px 0 5px;}
.mbar{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;}
.mbar>i{display:block;height:100%;background:var(--accent);border-radius:2px;}
.pfoot{margin-top:24px;}

/* ── view dia ──────────────────────────────────────── */
.strip{display:flex;align-items:center;gap:5px;margin-bottom:20px;flex-wrap:wrap;}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:7px 0 6px;cursor:pointer;min-width:52px;flex:1;max-width:78px;text-align:center;transition:.12s;}
.dchip:hover{border-color:var(--ink4);}
.dchip.sel{border-color:var(--ink);background:var(--sunken);}
.dcw{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;}
.dchip.hoje .dcw{color:var(--accent);}
.dcn{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.15;}
.dchip.hoje .dcn{color:var(--accent);}
.dcb{display:block;width:16px;height:3px;border-radius:2px;margin:4px auto 0;background:var(--line);}
.day{padding:28px 34px 70px;overflow-y:auto;flex:1;max-width:1180px;}
.dayhd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px;}
.day h1{font-size:29px;letter-spacing:-.03em;margin-top:4px;font-weight:600;}
.dayk{display:flex;gap:22px;align-items:flex-end;}
.dayk>div{text-align:right;}
.dayk span.num{font-size:22px;font-weight:600;letter-spacing:-.025em;display:block;line-height:1;}
.dayk small{font-size:10.5px;color:var(--ink3);display:block;margin-top:4px;}
.plbig{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;
  cursor:pointer;line-height:1.05;}
.plbig:hover{border-color:var(--ink4);}
.plbig{font-size:20px;font-weight:700;}
.plbig small{display:block;font-size:9.5px;font-weight:500;color:var(--ink3);margin-top:2px;}
.plbig.alt{background:var(--warn);border-color:var(--warn);color:#fff;}
.plbig.alt small{color:rgba(255,255,255,.85);}
.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start;}

.issues{display:grid;gap:9px;}
.iss{display:flex;gap:9px;font-size:12.5px;line-height:1.5;align-items:flex-start;}
.iss .ib2{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--warn);}
.iss.bad .ib2{background:var(--now);}
.card2.chk{border-color:var(--warn);}
.tips{display:grid;gap:10px;}
.tip{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:12.5px;line-height:1.5;}
.tip b{font-weight:600;}
.tip span{color:var(--ink2);}
@media(max-width:640px){ .tip{grid-template-columns:1fr;gap:2px;} }

.chores{display:grid;gap:11px;}
.chore{border:1px solid var(--line);border-radius:7px;padding:10px 12px;}
.chore.ok{opacity:.5;}
.chk2{display:flex;gap:9px;align-items:flex-start;cursor:pointer;}
.chk2 input{margin-top:2px;}
.cl b{font-size:13px;font-weight:600;display:block;}
.chore.ok .cl b{text-decoration:line-through;}
.cl small{font-size:11px;color:var(--ink3);}
.ci{margin:8px 0 0 24px;padding:0;list-style:none;display:grid;gap:3px;}
.ci li{font-size:11.5px;color:var(--ink2);position:relative;padding-left:11px;}
.ci li::before{content:'';position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink4);}
.nextch{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line2);font-size:11px;color:var(--ink3);}
.nextch b{color:var(--ink2);font-weight:600;}

.dlist{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.dli{display:flex;align-items:center;gap:9px;padding:7px 11px;background:var(--surface);font-size:12.5px;}
.dli.oh2{color:var(--ink3);font-style:italic;}
.ohm{width:16px;text-align:center;color:var(--ink4);flex:none;}
.dli.ok{opacity:.45;}
.dli.ok .dn2{text-decoration:line-through;}
.dli i{width:6px;height:6px;border-radius:50%;flex:none;}
.dli .dh2{color:var(--ink3);font-size:11.5px;min-width:38px;font-variant-numeric:tabular-nums;}
.dli .dn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dli .dd2{color:var(--ink3);font-size:11px;font-variant-numeric:tabular-nums;}

.regrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);}
.regrow:last-of-type{border-bottom:none;}
.rl2{flex:1;min-width:0;font-size:13px;font-weight:550;}
.rl2 small{display:block;font-size:11px;color:var(--ink3);font-weight:400;}
.rq{display:flex;align-items:center;gap:5px;}
.rq input{width:64px;padding:4px 6px;text-align:center;}
.ru{font-size:11px;color:var(--ink3);min-width:52px;}
.regfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);flex-wrap:wrap;}
.wtop{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;}
.wnum{font-size:26px;font-weight:600;letter-spacing:-.03em;}
.wsub{font-size:11.5px;color:var(--ink3);}
.wbar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-bottom:11px;}
.wbar>i{display:block;height:100%;background:#4a8fc2;border-radius:3px;transition:width .25s;}
.wbtn{display:flex;gap:6px;margin-bottom:13px;}
.wsched{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.wr2{display:flex;gap:10px;padding:5px 11px;background:var(--surface);font-size:12px;align-items:baseline;}
.wr2.past{color:var(--ink4);}
.wr2.past .wm{text-decoration:line-through;}
.wt{min-width:38px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.wm{font-weight:600;min-width:52px;}
.wn{color:var(--ink3);font-size:11px;}

.meals{display:grid;gap:13px;}
.meal b{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;}
.meal ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;}
.meal li{font-size:11.5px;color:var(--ink2);position:relative;padding-left:11px;}
.meal li::before{content:'';position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink4);}

/* ── dashboard ─────────────────────────────────────── */
.dash{padding:28px 34px 70px;overflow-y:auto;flex:1;}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px;}
.since{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.dash h1{font-size:29px;letter-spacing:-.03em;margin-top:4px;font-weight:600;}
.dsum{display:flex;gap:26px;}
.dsum>div{text-align:right;}
.dsum span{font-size:26px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1;}
.dsum small{font-size:10.5px;color:var(--ink3);display:block;margin-top:4px;}

.card2.assist{border-color:var(--accent);background:var(--accent-soft);}
.card2.assist h2{color:var(--accent);}
.mp2{padding:15px 17px;}
.mph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:11px;flex-wrap:wrap;}
.mps{font-size:12px;color:var(--ink3);margin-top:3px;}
.mpk{text-align:right;}
.mpk .num{font-size:22px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1;}
.mpk small{font-size:10.5px;color:var(--ink3);}
.mpgrid{display:grid;grid-template-columns:repeat(60,1fr);gap:3px;}
.mpgrid .pq{width:100%;aspect-ratio:1;border-radius:2px;cursor:default;}
.mpgrid .pq:hover{transform:none;}
.mpgrid .pq span{display:none;}
@media(max-width:820px){ .mpgrid{grid-template-columns:repeat(30,1fr);} }
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.tres>div{background:var(--sunken);border-radius:7px;padding:10px 12px;}
.tres b{display:block;font-size:20px;font-weight:700;margin-top:3px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px;}
.kpi{background:var(--surface);padding:14px 16px;}
.kn{font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1.1;}
.kl{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.35;font-weight:500;}
.ks{font-size:10.5px;color:var(--ink3);margin-top:2px;}

.card2{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px 18px;margin-bottom:16px;}
.card2>h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);
  font-weight:600;margin-bottom:10px;}
.cx{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:0 0 12px;}
.card2 .cx:last-child{margin:10px 0 0;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;}
.grid2>.card2{margin-bottom:0;}
.grid2{margin-bottom:16px;}

.heatwrap{overflow-x:auto;padding-bottom:6px;}
.heatwrap svg{display:block;}
.heatfoot{display:flex;justify-content:space-between;align-items:center;gap:18px;
  flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink3);}
.heatfoot b{color:var(--ink2);font-weight:600;}
.hleg{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.hleg i{width:11px;height:11px;border-radius:2.5px;display:block;}

.dquote{border-left:4px solid var(--gold);background:linear-gradient(90deg,
  color-mix(in srgb,var(--gold) 11%,transparent),transparent 70%);
  border-radius:0 10px 10px 0;padding:22px 24px;margin:4px 0 22px;}
.dquote p{color:var(--quoteink);}
.dquote p{margin:0;font-size:38px;line-height:1.18;font-weight:500;letter-spacing:-.028em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dquote .dqa{display:flex;gap:4px;margin-top:16px;align-items:center;}
.dquote .dqn{font-size:11px;color:var(--ink4);margin-right:auto;text-transform:uppercase;letter-spacing:.07em;}


.dn{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.lg{display:grid;gap:7px;flex:1;min-width:150px;}
.lgi{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.lgi i{width:9px;height:9px;border-radius:2px;flex:none;}
.lgi b{margin-left:auto;color:var(--ink2);font-weight:600;font-size:12px;}
.lgx{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;color:var(--ink3);}
.lgx span{display:flex;align-items:center;gap:5px;}
.lgx i{width:8px;height:8px;border-radius:2px;}

.ins{display:grid;gap:11px;}
.in{display:flex;gap:10px;font-size:13px;line-height:1.55;align-items:flex-start;}
.in .ib{width:3px;align-self:stretch;background:var(--accent);border-radius:2px;flex:none;}
.in b{font-weight:600;}

.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:16px;}
.rec{}
.rl{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.rv{font-size:21px;font-weight:600;letter-spacing:-.025em;margin:3px 0 1px;}
.rd{font-size:11px;color:var(--ink3);}

.shelf{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.bk{display:flex;align-items:baseline;gap:10px;padding:10px 13px;background:var(--surface);font-size:13px;flex-wrap:wrap;}
.bk .bm{margin-left:auto;color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;}

.ndf{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.ndf>div{flex:1;min-width:220px;}
.card2.desaf{border-color:var(--accent);}
.card2.nodesaf{border-color:var(--gold);border-style:dashed;}
.dnm{font-size:16px;font-weight:600;letter-spacing:-.015em;}
.ndb{display:flex;flex-wrap:wrap;gap:5px;}
.vitrine{display:flex;align-items:center;gap:18px;padding:14px 16px;margin-bottom:18px;
  background:var(--sunken);border-radius:10px;}
.vn{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1;}
.vl{font-size:11.5px;color:var(--ink3);margin-top:3px;}
.vx{font-size:11px;color:var(--ink2);margin-top:5px;font-weight:600;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:18px;}
.tg{}
.tgh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin-bottom:8px;}
.tgd{width:8px;height:8px;border-radius:50%;flex:none;}
.tgc{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums;}
.tro{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.tr{border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 7px;background:var(--surface);
  display:flex;align-items:center;gap:6px;}
.tr.on{border-color:var(--accent);background:var(--accent-soft);}
.tr .tn{font-size:11px;font-weight:600;}
.nx{margin-top:6px;}
.nxr{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink3);margin-bottom:5px;}
.nxr b{color:var(--ink2);font-weight:600;}
.nxv{font-variant-numeric:tabular-nums;white-space:nowrap;}
.nxb{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;}
.nxb>i{display:block;height:100%;border-radius:2px;}

/* ── side panel ────────────────────────────────────── */
.pn{margin-bottom:24px;}
.pn>h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);
  font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.pn>h3 .b{margin:-4px -6px;}
.quote{border-left:2px solid var(--ink);padding:2px 0 2px 13px;margin-bottom:22px;}
.quote p{margin:0;font-size:14.5px;line-height:1.45;font-weight:450;letter-spacing:-.005em;}
.quote .qa{display:flex;gap:2px;margin-top:9px;}

.nowbox{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px;}
.nowbox .nr{padding:9px 12px;border-bottom:1px solid var(--line2);}
.nowbox .nr:last-child{border-bottom:none;}
.nowbox .nl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;}
.nowbox .nv{font-size:13.5px;margin-top:3px;font-weight:500;}
.nowbox .nx{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;}

.gl{padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer;}
.gl:first-of-type{padding-top:0;}
.gl:hover .gt{color:var(--accent);}
.gt{font-size:13px;font-weight:550;display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.gt .gp{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:500;}
.gbar{height:3px;background:var(--sunken);border-radius:2px;margin:7px 0 5px;overflow:hidden;}
.gbar>i{display:block;height:100%;background:var(--accent);border-radius:2px;}
.gs{font-size:11.5px;color:var(--ink3);line-height:1.45;}
.gs b{color:var(--ink2);font-weight:600;}

.wkbar{display:grid;gap:11px;}
.wr .wrt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12.5px;margin-bottom:5px;}
.wr .wrt .v{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.wr .bar{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;}
.wr .bar>i{display:block;height:100%;border-radius:2px;}

.al{font-size:12.5px;line-height:1.5;padding:9px 0;border-bottom:1px solid var(--line2);
  display:flex;gap:9px;align-items:flex-start;}
.al:last-child{border-bottom:none;}
.al .am{width:3px;align-self:stretch;border-radius:2px;background:var(--ink4);flex-shrink:0;}
.al.win .am{background:var(--good);} .al.warn .am{background:var(--warn);}
.al.bad .am{background:var(--now);} .al.info .am{background:var(--ink4);}
.al .ax{margin-left:auto;color:var(--ink4);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;}
.al .ax:hover{color:var(--ink);}

.tk{padding:11px 0;border-bottom:1px solid var(--line2);}
.tk .tt{font-size:13px;font-weight:550;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.tk .ti{font-size:11.5px;color:var(--ink3);margin-top:1px;}
.ritmo{font-size:11px;margin-top:5px;padding:4px 7px;border-radius:5px;background:var(--sunken);color:var(--ink2);}
.ritmo.ok b{color:var(--good);} .ritmo.lo b{color:var(--warn);}
.tk .tq{display:flex;gap:4px;margin-top:8px;align-items:center;}
.tk .tq input{width:52px;padding:3px 6px;font-size:12px;text-align:center;}

/* ── modal ─────────────────────────────────────────── */
.bd{position:fixed;inset:0;background:rgba(15,15,14,.44);
  display:none;align-items:flex-start;justify-content:center;z-index:200;padding:60px 16px 20px;
  backdrop-filter:blur(2px);overflow-y:auto;}
.bd.on{display:flex;}
.md{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;
  width:100%;height:auto;max-width:430px;box-shadow:0 18px 56px rgba(0,0,0,.22);
  position:relative;z-index:1;}
.md.wide{max-width:560px;}
.md h3{font-size:16px;margin-bottom:17px;letter-spacing:-.015em;}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);}
.acts .left{margin-right:auto;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:13px;
  font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.chip:hover{border-color:var(--ink4);}
.chip.on{border-color:var(--ink);background:var(--sunken);font-weight:550;}
.chip i{width:7px;height:7px;border-radius:50%;display:block;}
.scope{display:grid;gap:6px;margin-top:4px;}
.sc{border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;}
.sc:hover{border-color:var(--ink4);}
.sc.on{border-color:var(--ink);background:var(--sunken);}
.sc small{display:block;color:var(--ink3);font-size:11px;margin-top:2px;}
.lst{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;}
.li{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--surface);font-size:13px;}
.li .lg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.li input{border:none;background:none;padding:2px 0;}
.li select{border:1px solid var(--line);padding:2px 4px;font-size:11px;flex:none;}
.li input:focus{border-bottom:1px solid var(--accent);border-radius:0;}
.pls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;}
.pl3{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 6px;
  cursor:pointer;text-align:center;}
.pl3:hover{border-color:var(--ink4);}
.pl3.on{border-color:var(--ink);background:var(--sunken);}
.pl3 b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;}
.pl3 span{display:block;font-size:10px;color:var(--ink3);margin-top:1px;}
.tmr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px;}
.tmr>div{background:var(--sunken);border-radius:6px;padding:8px 9px;}
.tl2{display:block;font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.tmr b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.tlist{border:1px solid var(--line);border-radius:7px;overflow:hidden;max-height:250px;overflow-y:auto;}
.tli{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line2);}
.tli:last-child{border-bottom:none;}
.tli i{width:6px;height:6px;border-radius:50%;flex:none;}
.tli .th{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:38px;}
.tli .tn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tli .td2{color:var(--ink3);font-size:11px;font-variant-numeric:tabular-nums;}
.notif{border-radius:8px;padding:11px 13px;margin-bottom:14px;border:1px solid var(--line);background:var(--sunken);}
.notif.granted{border-color:var(--good);}
.notif.denied{border-color:var(--now);}
.notif.default{border-color:var(--warn);}
.nfh{font-size:12.5px;font-weight:600;margin-bottom:4px;}
.nfp{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:0 0 8px;}
.notif .b{margin-bottom:0;}
.cent{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.cent input{flex:1;min-width:150px;}
.cou{font-size:11.5px;color:var(--ink3);}
.verbox{display:flex;align-items:center;gap:10px;justify-content:space-between;
  font-size:11.5px;color:var(--ink3);margin-bottom:12px;padding-bottom:11px;
  border-bottom:1px solid var(--line2);}
.verbox b{color:var(--ink2);font-variant-numeric:tabular-nums;}
.urlbox{background:var(--sunken);border-radius:8px;padding:11px 13px;margin-bottom:14px;}
.ulab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink3);font-weight:600;margin-bottom:6px;}

.pomo{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:250;

.pmain{display:flex;align-items:center;gap:16px;padding:11px 16px;flex-wrap:wrap;}
.pclock{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.pinfo{flex:1;min-width:120px;}

.pacts{display:flex;gap:5px;flex-wrap:wrap;}

.pomo .b.line{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.06);}
.pomo .b:hover{background:rgba(255,255,255,.16);}
.pbrk{padding:0 16px 12px;font-size:12px;line-height:1.5;}

.pbrk span{display:block;opacity:.62;font-size:11.5px;margin-top:3px;}

.prun small{display:block;font-size:11px;color:var(--ink3);}

.pscope{display:flex;gap:4px;margin:4px 0 10px;}
.pscope .b.on{background:var(--sunken);font-weight:600;}
.ptasks{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);
  border-radius:7px;overflow:hidden;max-height:280px;overflow-y:auto;}

const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const TODAY=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};

const fmtL=d=>`${d.getDate()} de ${MON[d.getMonth()]} de ${d.getFullYear()}`;
const dUntil=s=>Math.round((pISO(s)-TODAY())/864e5);

/* ── migração da v4 (v:3) ──────────────────────────────
   Os ids dos blocos mudaram, então as marcações antigas não
   podem virar checkboxes. As HORAS, porém, são preservadas:
   resolvemos cada conclusão contra o template antigo salvo no
   próprio arquivo e guardamos o total em `legacy`.          */
function migrate(p){
  if(!p||p.v!==3) return null;
  const N=defaults();
  const CM={alemao:'idioma',mentoria:'estudo',planejamento:'projeto',sabbath:'fe',church:'fe',
            meditacao:'saude',rotina:'pausa',cinema:'social',treino:'treino',leitura:'leitura',
            trabalho:'trabalho',social:'social',refeicao:'refeicao',lembrete:'lembrete'};
  const min={}; let sess=0, days=0;
  Object.entries(p.overrides||{}).forEach(([k,o])=>{
    if(!o||!o.done||!Object.keys(o.done).length) return;
    const tpl=(p.template&&p.template[pISO(k).getDay()])||[]; let any=false;
    Object.keys(o.done).forEach(key=>{
      const id=key.slice(key.indexOf(':')+1);
      const b=tpl.find(x=>x.id===id) || (p.events||[]).find(x=>x.id===id);
      if(b){ const c=CM[b.category]||'pausa'; min[c]=(min[c]||0)+(b.dur||0); sess++; any=true; }
    });
    if(any) days++;
    if(o.off&&(o.off.manha||o.off.tarde||o.off.noite))
      N.overrides[k]={off:{m:!!o.off.manha,t:!!o.off.tarde,n:!!o.off.noite},done:{},moves:{},skips:[]};
  });
  N.legacy={min,sess,days};

  if(Array.isArray(p.goals)) N.goals=p.goals.map(g=>
    g.kind==='fund'  ? {id:g.id,kind:'fund',label:g.label,target:Math.round((g.cost||0)*100),
                        saved:Math.round((g.saved||0)*100),date:g.targetDate||'',note:g.note||''}
  : (g.kind==='month'||g.kind==='monthly') ? {id:g.id,kind:'month',label:g.label,
                        target:Math.round((g.monthlyTarget||0)*100),
                        saved:Math.round((g.savedThisMonth!=null?g.savedThisMonth:g.saved||0)*100),note:g.note||''}
  :                    {id:g.id,kind:'pct',label:g.label,pct:g.value||0,note:g.note||'',date:g.targetDate||''});

  const t1=N.trackers[0];
  if(p.reading){
    if(p.reading.dailyGoal) t1.dailyGoal=p.reading.dailyGoal;
    if(p.reading.title) t1.item={title:p.reading.title,total:p.reading.totalPages||0,
      done:p.reading.currentPage||0,startedISO:p.reading.startedISO||N.created};
  }
  t1.log=Object.assign({},p.readLog||{});
  t1.archive=(p.library||[]).map(b=>({title:b.title,total:b.totalPages,finished:b.finishedISO,days:b.days}));
  const t2=N.trackers[1];
  if(p.mentoria&&p.mentoria.topic) t2.item={title:p.mentoria.topic,total:p.mentoria.totalModules||0,
    done:p.mentoria.doneModules||0,startedISO:N.created};

  N.events=(p.events||[]).map(e=>({id:e.id,date:e.date,start:e.start,dur:e.dur,title:e.title,
    cat:CM[e.category]||'lembrete',note:e.note||'',allDay:!!e.allDay,alert:null}));
  N.closed=p.closedDays||{}; N.chalDone=p.completedChallenges||[];
  N.challenge=p.activeChallenge||null;
  N.bestStreak=p.bestStreak||0; N.created=p.createdAt||N.created;
  N.booksYear=p.booksYearGoal||12; N.lastBackup=p.lastBackup||'';
  return N;
}
function adopt(raw){
  try{
    const p=typeof raw==='string'?JSON.parse(raw):raw;
    if(!p) return null;
    if(p.v===5) return Object.assign(defaults(),p);
    const m=migrate(p);
    if(m){ setTimeout(()=>toast('Dados da versão anterior migrados. As horas já concluídas foram preservadas.',true),900); return m; }
  }catch(e){}
  return null;
}

const MINLV={A:1,B:2,C:3};

const ajustesDe=k=>{ const o=S.overrides[k]||{};

const EMPTY={off:{m:false,t:false,n:false},done:{},moves:{},skips:[]};
function ov(k){ if(!S.overrides[k]) S.overrides[k]={off:{m:false,t:false,n:false},done:{},moves:{},skips:[]};
  const o=S.overrides[k]; o.off=o.off||{m:false,t:false,n:false}; o.done=o.done||{}; o.moves=o.moves||{}; o.skips=o.skips||[]; return o; }
const ovR=k=>S.overrides[k]||EMPTY;
const per=m=> m<12*60?'m':(m<18*60?'t':'n');
const PERL={m:'manhã',t:'tarde',n:'noite'};
const cat=id=>S.cats.find(c=>c.id===id)||{id,label:id,color:'#9a9790',track:false,week:0};

/** Overhead: ocupa tempo na agenda mas não é tarefa a cumprir. */
const overhead=x=>!!cat(x.cat).noTask;

function recurOn(d,r){
  if(d.getDay()!==r.dow) return false;
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-pISO(r.ref))/864e5);
  return diff>=0 && diff%r.every===0;
}
/** instâncias de um dia, com overrides e eventos aplicados */
function inst(d){
  const k=iso(d), o=ovR(k), out=[];
  const pl=o.plan||'A', minLv=MINLV[pl]||1;
  const dur4=(b,base)=> pl==='C'&&b.durLow ? Math.min(b.durLow,base) : base;
  const recs=(S.recurring||[]).filter(r=>recurOn(d,r));
  const repl=recs.flatMap(r=>(r.replaces||'').split('|')).map(x=>x.trim()).filter(Boolean);
  (S.template[d.getDay()]||[]).forEach(b=>{
    if(o.skips.includes(b.id)) return;
    if(repl.some(rx=>b.title.includes(rx))) return;
    if((b.lv===undefined?2:b.lv)<minLv) return;
    const mv=o.moves[b.id];
    const start=mv?mv.start:b.start, dur=dur4(b, mv?(mv.dur||b.dur):b.dur);
    if(o.off[per(t2m(start))]) return;
    out.push({key:'b:'+b.id, sid:b.id, src:'b', date:k, start, dur, title:b.title,
      cat:b.cat, fixed:b.fixed, trk:b.trk, alert:b.alert, lv:b.lv, durLow:b.durLow,
      done:!!o.done['b:'+b.id], moved:!!mv});
  });
  recs.forEach(r=>{
    if(o.skips.includes(r.id)) return;
    if((r.lv===undefined?2:r.lv)<minLv) return;
    const mv=o.moves[r.id];
    out.push({key:'r:'+r.id, sid:r.id, src:'r', date:k, start:mv?mv.start:r.start,
      dur:mv?(mv.dur||r.dur):r.dur, title:r.label, cat:r.cat, fixed:false, trk:null,
      alert:r.alert, lv:r.lv, done:!!o.done['r:'+r.id], recurring:true});
  });
  (S.events||[]).filter(e=>e.date===k).forEach(e=>{
    if((e.lv===undefined?2:e.lv)<minLv) return;
    if(!e.allDay && o.off[per(t2m(e.start||'12:00'))]) return;
    out.push({key:'e:'+e.id, sid:e.id, src:'e', date:k, start:e.start||'12:00', dur:e.dur||60,
      title:e.title, cat:e.cat||'lembrete', fixed:false, trk:e.trk||null, alert:e.alert,
      lv:e.lv, allDay:!!e.allDay, note:e.note||'', done:!!o.done['e:'+e.id]});
  });
  out.sort((a,b)=>t2m(a.start)-t2m(b.start)||b.dur-a.dur);
  return out;
}

function layout(items){
  const evs=items.filter(x=>!x.allDay).map(x=>({...x,s:t2m(x.start),e:t2m(x.start)+Math.max(10,x.dur)}))
    .sort((a,b)=>a.s-b.s||b.e-a.e);
  const groups=[]; let cur=[],end=-1;
  evs.forEach(v=>{ if(cur.length&&v.s>=end){groups.push(cur);cur=[];end=-1;} cur.push(v); end=Math.max(end,v.e); });
  if(cur.length)groups.push(cur);
  groups.forEach(g=>{
    const cols=[];
    g.forEach(v=>{ let ok=false;
      for(let i=0;i<cols.length;i++){ if(cols[i][cols[i].length-1].e<=v.s){cols[i].push(v);v.col=i;ok=true;break;} }
      if(!ok){cols.push([v]);v.col=cols.length-1;} });
    g.forEach(v=>{ let sp=1;
      for(let i=v.col+1;i<cols.length;i++){ if(cols[i].some(o=>o!==v&&o.s<v.e&&o.e>v.s))break; sp++; }
      v.span=sp; v.n=cols.length; });
  });
  return evs;
}
function weekStats(ref){
  const a=sow(ref), done={}, total={}; let t=0,td=0;
  S.cats.filter(c=>c.track).forEach(c=>{done[c.id]=0;total[c.id]=0;});
  for(let i=0;i<7;i++) inst(addD(a,i)).forEach(x=>{
    if((!x.fixed||x.trk)&&!overhead(x)){ t++; if(x.done)td++; }
    if(done[x.cat]!==undefined){ total[x.cat]+=x.dur; if(x.done)done[x.cat]+=x.dur; }
  });
  return {t,td,rate:t?Math.round(td/t*100):0,done,total};
}
function dayRate(d){
  const k=iso(d), o=ovR(k);

  const it=inst(d).filter(x=>!x.fixed&&!overhead(x));
  return it.length? it.filter(x=>x.done).length/it.length : null;
}
function streak(){

}

    inst(pISO(k)).forEach(x=>{ if(x.done&&h[x.cat]!==undefined){h[x.cat]+=x.dur;sess++;} });
  });
  const lg=S.legacy||{min:{},sess:0,days:0};
  Object.entries(lg.min||{}).forEach(([c,m])=>{ if(h[c]!==undefined) h[c]+=m; });
  sess+=lg.sess||0; days+=lg.days||0;
  const st=streak(); if(st>(S.bestStreak||0)){S.bestStreak=st;save();}
  const tot=S.cats.filter(c=>c.track).reduce((a,c)=>a+h[c.id],0);
  let units=0,items=0;
  (S.trackers||[]).forEach(t=>{ units+=Object.values(t.log||{}).reduce((a,b)=>a+(+b||0),0); items+=(t.archive||[]).length; });
  return {h,tot,days,sess,units,items,streak:st,best:S.bestStreak||0,
    chal:(S.chalDone||[]).length, closed:Object.keys(S.closed||{}).length,
    since:Math.max(1,dSince(S.created)+1)};
}

function moveInst(d,toK,start){

/* ── histórico: só recalcula quando os dados mudam ── */
let _hcache=null;
function invalidate(){ _hcache=null; }

function dayStat(k){
  const o=S.overrides[k];
  if(!o||!o.done||!Object.keys(o.done).length) return null;
  const it=inst(pISO(k)), flex=it.filter(x=>!x.fixed&&!overhead(x));
  const doneAll=it.filter(x=>x.done);
  let min=0; const byCat={};
  doneAll.forEach(x=>{ if(cat(x.cat).track){ min+=x.dur; byCat[x.cat]=(byCat[x.cat]||0)+x.dur; } });
  const fd=doneAll.filter(x=>!x.fixed&&!overhead(x)).length;
  return {rate: flex.length? fd/flex.length : 0, fdone:fd, ftotal:flex.length,
          done:doneAll.length, total:it.length, min, byCat, items:it};
}
function history(){
  if(_hcache) return _hcache;
  const start=pISO(S.created), today=TODAY();
  const days=[];                                   // {k,d,stat}
  for(let d=new Date(start); d<=today; d=addD(d,1)) days.push({k:iso(d),d:new Date(d),s:dayStat(iso(d))});
  const withData=days.filter(x=>x.s);

  // por dia da semana
  const dow=[0,1,2,3,4,5,6].map(w=>{const l=withData.filter(x=>x.d.getDay()===w);
    return {w,n:l.length,rate:l.length?l.reduce((a,b)=>a+b.s.rate,0)/l.length:null};});

  // por faixa horária
  const BK=[[0,540,'antes das 9h'],[540,720,'9h–12h'],[720,900,'12h–15h'],
            [900,1080,'15h–18h'],[1080,1260,'18h–21h'],[1260,1440,'depois das 21h']];
  const hours=BK.map(([lo,hi,lab])=>{let d=0,t=0;
    withData.forEach(x=>x.s.items.forEach(i=>{ if(i.fixed||overhead(i))return;
      const m=t2m(i.start);   // já é o horário efetivo do dia, com o bloco movido
      if(m>=lo&&m<hi){t++; if(i.done)d++;} }));
    return {lab,n:t,rate:t?d/t:null};});

  // semanas
  const weeks=[]; let w0=sow(today);
  for(let i=11;i>=0;i--){ const a=addD(w0,-7*i); let d=0,t=0,min=0;
    for(let j=0;j<7;j++){ const st=days.find(x=>x.k===iso(addD(a,j)));
      if(st&&st.s){ d+=st.s.fdone; t+=st.s.ftotal; min+=st.s.min; } }
    weeks.push({a,rate:t?d/t:0,min,has:t>0}); }

  // maior sequência de todos os tempos
  let run=0, bestRun=0;
  days.forEach(x=>{
    const off=(S.overrides[x.k]||{}).off||{};
    if(off.m&&off.t&&off.n) return;                 // folga marcada não quebra
    const r=x.s?x.s.rate:0;
    if(r>=.6){ run++; if(run>bestRun) bestRun=run; } else run=0;
  });
  if(bestRun>(S.bestStreak||0)){ S.bestStreak=bestRun; try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }

  // recordes
  const best=withData.slice().sort((a,b)=>b.s.rate-a.s.rate||b.s.min-a.s.min)[0]||null;
  const longest=withData.slice().sort((a,b)=>b.s.min-a.s.min)[0]||null;
  let bestUnit=null;
  (S.trackers||[]).forEach(t=>Object.entries(t.log||{}).forEach(([k,v])=>{
    if(!bestUnit||v>bestUnit.v) bestUnit={k,v,unit:t.unit,label:t.label};}));
  const bestWeek=weeks.filter(w=>w.has).slice().sort((a,b)=>b.rate-a.rate)[0]||null;

  _hcache={days,withData,dow,hours,weeks,best,longest,bestUnit,bestWeek,bestRun};
  return _hcache;
}

/* ── gráficos em SVG ── */
/** Nível 0–4 conforme o tempo dedicado no dia, medido contra
    a sua própria meta diária (soma das metas semanais ÷ 7).
    Se você mudar as metas, a escala se reajusta sozinha.        */
function dailyTarget(){
  const t=S.cats.filter(c=>c.track).reduce((a,c)=>a+(c.week||0),0)/7;
  return Math.max(30,t||120);
}
function heatLevel(min){
  if(min<=0) return 0;
  const r=min/dailyTarget();
  return r<.25?1:r<.6?2:r<1?3:4;
}
function svgHeat(H){
  const today=TODAY(), created=pISO(S.created);
  const nW=Math.max(16,Math.min(53,Math.ceil((today-created)/6048e5)+8));
  const first=addD(sow(today),-7*(nW-1));
  const C=11, G=3, S1=C+G, LEFT=30, TOP=15;
  let cells='',rows='',months='',lastM=-1;
  ['Seg','','Qua','','Sex','','Dom'].forEach((l,i)=>{ if(l)
    rows+=`<text x="${LEFT-5}" y="${TOP+i*S1+9}" text-anchor="end" class="hx">${l}</text>`; });
  let nDays=0, nMin=0;
  for(let w=0;w<nW;w++){
    const wd=addD(first,w*7);
    const mEnd=addD(wd,6);
    if(mEnd.getMonth()!==lastM && mEnd.getDate()<=7){ lastM=mEnd.getMonth();
      months+=`<text x="${LEFT+w*S1}" y="9" class="hx">${MON[lastM].slice(0,3)}</text>`; }
    for(let i=0;i<7;i++){
      const d=addD(wd,i), k=iso(d);
      if(d>today||d<created) continue;
      const st=dayStat(k), off=(S.overrides[k]||{}).off||{};
      const folga=off.m&&off.t&&off.n;
      const min=st?st.min:0, lv=folga?0:heatLevel(min);
      if(st){ nDays++; nMin+=min; }
      const tip=folga?`${fmtS(d)} · dia de folga`
        :st?`${fmtS(d)} · ${hhm(min)} dedicadas · ${st.fdone} de ${st.ftotal} atividades (${Math.round(st.rate*100)}%)`
        :`${fmtS(d)} · sem registro`;
      const extra = folga ? ' stroke="var(--ink4)" stroke-width="1" stroke-dasharray="2 2"'
        : k===iso(today) ? ' stroke="var(--ink)" stroke-width="1.5"' : '';
      cells+=`<rect x="${LEFT+w*S1}" y="${TOP+i*S1}" width="${C}" height="${C}" rx="2.5"
        fill="var(--hm${lv})"${extra}><title>${tip}</title></rect>`;
    }
  }
  const W=LEFT+nW*S1+4, Ht=TOP+7*S1;
  const svg=`<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" style="display:block">
    <style>.hx{font-size:9.5px;fill:var(--ink3);font-family:inherit}</style>${months}${rows}${cells}</svg>`;
  let leg='';
  for(let l=0;l<5;l++) leg+=`<i style="background:var(--hm${l})"></i>`;
  return `<div class="heatwrap">${svg}</div>
    <div class="heatfoot">
      <span>${nDays} dia(s) com registro · <b>${Math.round(nMin/60)}h</b> dedicadas neste período</span>
      <span class="hleg">Menos ${leg} Mais</span>
    </div>`;
}
/** Barras empilhadas: onde o tempo foi, semana a semana. */
function svgStack(H){
  const cats=S.cats.filter(c=>c.track);
  const sem=[];
  for(let i=7;i>=0;i--){
    const a0=addD(sow(TODAY()),-7*i), por={}; let tot=0;
    cats.forEach(c=>por[c.id]=0);
    for(let j=0;j<7;j++){ const st=dayStat(iso(addD(a0,j)));
      if(st) Object.entries(st.byCat||{}).forEach(([k,v])=>{ if(por[k]!==undefined){por[k]+=v;tot+=v;} }); }
    sem.push({a:a0,por,tot});
  }
  if(!sem.some(x=>x.tot>0)) return null;
  /* PT reserva o espaço do rótulo acima da barra; a escala ganha
     folga para a barra mais alta não encostar no teto.          */
  const W=560,Ht=205,PB=30,PL=36,PT=24;
  const max=Math.max(60,...sem.map(x=>x.tot))*1.08;
  const bw=(W-PL-8)/sem.length*0.62, step=(W-PL-8)/sem.length;
  let g='',bars='';
  [0,.5,1].forEach(v=>{ const y=Ht-PB-v*(Ht-PB-PT);
    g+=`<line x1="${PL}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 3"/>
       <text x="${PL-6}" y="${y+3}" text-anchor="end" class="ax">${Math.round(max*v/60)}h</text>`; });
  sem.forEach((x,i)=>{
    const x0=PL+i*step+(step-bw)/2; let y=Ht-PB;
    cats.forEach(c=>{ const v=x.por[c.id]; if(!v) return;
      const hh=(v/max)*(Ht-PB-PT); y-=hh;
      bars+=`<rect x="${x0.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}"
        fill="${c.color}"><title>${fmtS(x.a)} · ${c.label}: ${hhm(v)}</title></rect>`; });
    bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${Ht-PB+13}" text-anchor="middle" class="ax">${fmtS(x.a).slice(0,5)}</text>`;
    if(x.tot) bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${Math.max(11,y-5).toFixed(1)}"
      text-anchor="middle" class="axb">${Math.round(x.tot/60)}h</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto">
    <style>.ax{font-size:9.5px;fill:var(--ink3);font-family:inherit}
    .axb{font-size:10.5px;fill:var(--ink2);font-weight:600;font-family:inherit}</style>${g}${bars}</svg>`;
}
function svgDonut(L){
  const cs=S.cats.filter(c=>c.track&&L.h[c.id]>0);
  if(!cs.length) return null;
  const tot=cs.reduce((a,c)=>a+L.h[c.id],0), R=62, r=40, C=80;
  let a0=-Math.PI/2, paths='';
  cs.sort((a,b)=>L.h[b.id]-L.h[a.id]).forEach(c=>{
    const frac=L.h[c.id]/tot, a1=a0+frac*Math.PI*2, big=frac>.5?1:0;
    const P=(rad,ang)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    const[x1,y1]=P(R,a0),[x2,y2]=P(R,a1),[x3,y3]=P(r,a1),[x4,y4]=P(r,a0);
    paths+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z"
      fill="${c.color}"><title>${c.label}: ${(L.h[c.id]/60).toFixed(1)}h (${Math.round(frac*100)}%)</title></path>`;
    a0=a1;
  });
  return `<svg viewBox="0 0 160 160" style="width:150px;height:150px;flex:none">${paths}
    <text x="80" y="76" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--ink);font-family:inherit">${Math.round(tot/60)}h</text>
    <text x="80" y="92" text-anchor="middle" style="font-size:9px;fill:var(--ink3);font-family:inherit">no total</text></svg>`;
}
function svgBars(rows,label){
  if(!rows.some(r=>r.rate!==null)) return null;
  const W=330, RH=21, Ht=rows.length*RH+5, PL=100;
  return `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;max-width:${W}px;height:auto"><style>.bx{font-size:10px;fill:var(--ink2);font-family:inherit}.bv{font-size:9.5px;fill:var(--ink3);font-family:inherit}</style>`+
    rows.map((r,i)=>{ const y=i*RH+3, bw=(W-PL-40)*(r.rate||0);
      const col=r.rate===null?'var(--line)':r.rate>=.7?'var(--good)':r.rate>=.45?'var(--warn)':'var(--now)';
      return `<text x="${PL-8}" y="${y+12}" text-anchor="end" class="bx">${r.lab}</text>
        <rect x="${PL}" y="${y+4}" width="${W-PL-40}" height="9" rx="2.5" fill="var(--sunken)"/>
        <rect x="${PL}" y="${y+4}" width="${Math.max(0,bw).toFixed(1)}" height="9" rx="2.5" fill="${col}"/>
        <text x="${W-36}" y="${y+12}" class="bv">${r.rate===null?'—':Math.round(r.rate*100)+'%'}</text>`;
    }).join('')+`</svg>`;
}
function dreamTimeline(){
  const gs=S.goals.filter(g=>g.kind==='fund'&&g.target>0);
  if(!gs.length) return null;
  const el=Math.max(1,dSince(S.created));
  const rows=gs.map(g=>{
    const rest=Math.max(0,g.target-(g.saved||0)), rate=(g.saved||0)/el;
    const proj=rest<=0?TODAY():(rate>0?addD(TODAY(),Math.ceil(rest/rate)):null);
    return {g,rest,proj,tgt:g.date?pISO(g.date):null,pct:gpct(g)};
  });
  const dates=rows.flatMap(r=>[r.proj,r.tgt].filter(Boolean));
  if(!dates.length) return null;
  const maxD=new Date(Math.max(...dates.map(d=>+d))), minD=TODAY();
  const span=Math.max(30,(maxD-minD)/864e5);
  const W=560, RH=44, Ht=rows.length*RH+30, PL=4, PR=8;
  const x=d=>PL+((d-minD)/864e5/span)*(W-PL-PR);
  let out=`<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto"><style>.tl{font-size:11px;fill:var(--ink);font-family:inherit;font-weight:600}.ts{font-size:9.5px;fill:var(--ink3);font-family:inherit}</style>`;
  out+=`<line x1="${PL}" x2="${W-PR}" y1="${Ht-14}" y2="${Ht-14}" stroke="var(--line)"/>
        <text x="${PL}" y="${Ht-3}" class="ts">hoje</text>
        <text x="${W-PR}" y="${Ht-3}" text-anchor="end" class="ts">${fmtS(maxD)}/${maxD.getFullYear()}</text>`;
  rows.forEach((r,i)=>{
    const y=i*RH+16;
    out+=`<text x="${PL}" y="${y-2}" class="tl">${esc(r.g.label)}</text>`;
    out+=`<line x1="${PL}" x2="${W-PR}" y1="${y+9}" y2="${y+9}" stroke="var(--line2)" stroke-width="5" stroke-linecap="round"/>`;
    if(r.proj){ const px=x(r.proj);
      out+=`<line x1="${PL}" x2="${px.toFixed(1)}" y1="${y+9}" y2="${y+9}" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="${px.toFixed(1)}" cy="${y+9}" r="5" fill="var(--accent)"><title>No ritmo atual: ${fmtS(r.proj)}/${r.proj.getFullYear()}</title></circle>
        <text x="${Math.min(px,W-70).toFixed(1)}" y="${y+26}" class="ts">ritmo atual · ${fmtS(r.proj)}/${String(r.proj.getFullYear()).slice(2)}</text>`; }
    if(r.tgt){ const tx=x(r.tgt);
      out+=`<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${y+1}" y2="${y+17}" stroke="var(--now)" stroke-width="2" stroke-dasharray="3 2"><title>Sua data alvo: ${fmtS(r.tgt)}</title></line>`; }
  });
  return out+'</svg>';
}
function insights(H,L){
  const out=[];
  const dws=H.dow.filter(d=>d.n>=2&&d.rate!==null);
  if(dws.length>=3){
    const b=dws.slice().sort((a,c)=>c.rate-a.rate)[0], w=dws.slice().sort((a,c)=>a.rate-c.rate)[0];
    if(b.w!==w.w&&b.rate-w.rate>.12){
      out.push(`Seu dia mais forte é <b>${DOWL[b.w].toLowerCase()}</b> (${Math.round(b.rate*100)}%) e o mais fraco é <b>${DOWL[w.w].toLowerCase()}</b> (${Math.round(w.rate*100)}%). Aliviar a carga de ${DOWL[w.w].toLowerCase()} pode render mais que insistir nela.`);
    }
  }
  const hb=H.hours.filter(h=>h.n>=4&&h.rate!==null);
  if(hb.length>=2){
    const b=hb.slice().sort((a,c)=>c.rate-a.rate)[0], w=hb.slice().sort((a,c)=>a.rate-c.rate)[0];
    if(b.lab!==w.lab&&b.rate-w.rate>.15)
      out.push(`Você cumpre <b>${Math.round(b.rate*100)}%</b> do que agenda ${b.lab} e só <b>${Math.round(w.rate*100)}%</b> do que cai ${w.lab}. Vale mover o que importa para a primeira janela.`);
  }
  const rec=H.weeks.filter(w=>w.has).slice(-4), old=H.weeks.filter(w=>w.has).slice(-8,-4);
  if(rec.length>=2&&old.length>=2){
    const a=rec.reduce((x,y)=>x+y.rate,0)/rec.length, b=old.reduce((x,y)=>x+y.rate,0)/old.length;
    const dif=Math.round((a-b)*100);
    if(Math.abs(dif)>=8) out.push(dif>0
      ? `Suas últimas 4 semanas estão <b>${dif} pontos acima</b> das 4 anteriores. A curva está subindo.`
      : `Suas últimas 4 semanas caíram <b>${-dif} pontos</b> em relação às anteriores. Talvez a rotina esteja ambiciosa demais para a fase atual.`);
  }
  const W=weekStats(TODAY());
  S.cats.filter(c=>c.track&&c.week>0).forEach(c=>{
    const d=W.done[c.id]||0;
    if(d>=c.week) out.push(`<b>${esc(c.label)}</b> já bateu a meta da semana (${hhm(d)} de ${hhm(c.week)}).`);
  });
  if(L.streak>=3&&L.streak>=L.best) out.push(`Você está vivendo sua <b>maior sequência até hoje</b>. Quebrar agora custa mais do que continuar.`);
  else if(L.best>L.streak&&L.streak>0&&L.best-L.streak<=5)
    out.push(`Faltam <b>${L.best-L.streak+1} dias</b> para superar sua maior sequência (${L.best} dias).`);
  const gs=S.goals.filter(g=>g.kind==='fund'&&g.target>0&&g.date);
  gs.forEach(g=>{ const el=Math.max(1,dSince(S.created)), rate=(g.saved||0)/el;
    const rest=Math.max(0,g.target-(g.saved||0));
    if(rate>0&&rest>0){ const proj=addD(TODAY(),Math.ceil(rest/rate)), tgt=pISO(g.date);
      const dif=Math.round((proj-tgt)/864e5);
      if(dif>20) out.push(`No ritmo atual, <b>${esc(g.label).toLowerCase()}</b> atrasa ${dif} dias em relação à sua data alvo. Seriam <b>${brl(rest/Math.max(1,dUntil(g.date)/30.4))}</b> por mês para chegar no prazo.`);
      else if(dif<-20) out.push(`No ritmo atual você chega em <b>${esc(g.label).toLowerCase()}</b> com ${-dif} dias de antecedência.`); } });
  if(!H.withData.length) out.push('Marque as atividades concluídas durante a semana. Com alguns dias de registro este painel começa a mostrar seus padrões reais.');
  return out.slice(0,4);
}

/** Reduz a fonte da frase até ela caber numa linha só. */

  while(n>17 && p.scrollWidth>p.clientWidth){ n-=1; p.style.fontSize=n+'px'; }

/* ── Checagem de realismo ──────────────────────────────
   Uma agenda que não cabe no dia produz sensação de fracasso
   que não é sua. Estas regras apontam onde ela não fecha.   */
const MIN_DESLOC=5;
/* Refeição tem hora. Almoço é entre meio-dia e duas, não às 10:30. */
const JANELAS=[
  [/Café da manhã/i,        330, 600, 'entre 05:30 e 10:00'],
  [/Colação/i,              480, 690, 'entre 08:00 e 11:30'],
  [/Almoço/i,               720, 840, 'entre 12:00 e 14:00'],
  [/Lanche/i,               900,1050, 'entre 15:00 e 17:30'],
  [/Janta|Jantar/i,        1020,1200, 'entre 17:00 e 20:00'],
  [/Ceia/i,                1200,1350, 'entre 20:00 e 22:30'],
];
function janelaDe(titulo){
  const j=JANELAS.find(([rx])=>rx.test(titulo||''));
  return j?{min:j[1],max:j[2],txt:j[3]}:null;
}
function dayIssues(d){
  const k=iso(d), out=[];
  const it=inst(d).filter(x=>!x.allDay).slice().sort((a,b)=>t2m(a.start)-t2m(b.start));
  const ch=choresFor(d);
  const todos=[...it.map(x=>({s:t2m(x.start),e:t2m(x.start)+x.dur,t:x.title,out:x.out})),
               ...ch.map(x=>({s:t2m(x.time),e:t2m(x.time)+x.dur,t:x.label,out:!x.dentro,chore:true}))]
              .sort((a,b)=>a.s-b.s);

  const livre=new Set(it.filter(x=>x.cat==='pausa').map(x=>x.title));
  for(let i=0;i<todos.length-1;i++){
    const a=todos[i], b=todos[i+1];
    const gap=b.s-a.e;
    // um bloco de tempo livre existe justamente para ser preenchido
    const preenchivel=(a.chore&&livre.has(b.t))||(b.chore&&livre.has(a.t));
    if(gap<0&&preenchivel) continue;
    if(gap<0) out.push({t:'bad',m:`<b>${esc(a.t)}</b> termina ${m2t(a.e)} mas <b>${esc(b.t)}</b> começa ${m2t(b.s)} — ${-gap} min de conflito.`});
    else if(gap<MIN_DESLOC && (a.out||b.out) && !preenchivel)
      out.push({t:'warn',m:`Só ${gap} min entre <b>${esc(a.t)}</b> e <b>${esc(b.t)}</b>, e uma delas é fora de casa. Falta tempo de deslocamento.`});
  }
  const fim=todos.length?Math.max(...todos.map(x=>x.e)):0;
  const dormir=t2m(S.sleep[d.getDay()]);
  if(fim>dormir) out.push({t:'warn',m:`O dia só termina ${m2t(fim)}, depois da hora de dormir (${S.sleep[d.getDay()]}).`});

  const prox=S.wake[(d.getDay()+1)%7];
  const horas=((1440-dormir)+t2m(prox))/60;
  if(horas<7.5) out.push({t:'bad',m:`Dormindo ${S.sleep[d.getDay()]} e acordando ${prox}, sobram <b>${horas.toFixed(1)}h</b> de sono. Sua meta é 8h.`});
  else if(horas<7.9) out.push({t:'warn',m:`${horas.toFixed(1)}h de sono nesta noite — pouco abaixo das 8h.`});

  it.forEach(x=>{ const j=janelaDe(x.title); if(!j) return;
    const m=t2m(x.start);
    if(m<j.min||m>j.max)
      out.push({t:'warn',m:`<b>${esc(x.title)}</b> está às ${x.start}. O normal é ${j.txt}.`});
  });
  const aj=ajustesDe(k);
  if(aj>=3) out.push({t:'warn',m:`Este dia tem <b>${aj} ajustes</b> de horário gravados. Se as atividades estiverem fora do lugar, use <b>Restaurar horários</b> no topo.`});
  const banho=it.some(x=>/Banho/i.test(x.title));
  const treinou=it.some(x=>x.cat==='treino');
  if(treinou&&!banho) out.push({t:'warn',m:'Tem treino no dia e nenhum bloco de banho. Reserve ao menos 20 min.'});
  return out;
}

function dayTips(d){
  const t=[], k=iso(d), dow=d.getDay(), ch=choresFor(d), pl=planOf(k);
  ch.forEach(c=>{ if(c.note) t.push([c.label, c.note]); });
  if(ch.some(c=>c.kind==='prep')) t.push(['Depois de cozinhar','Porcione em potes de um dia e etiquete com a data. O que for para depois de amanhã, congele.']);
  if(ch.some(c=>c.kind==='compra')) t.push(['Ao guardar as compras','Fruta cortada dura 3 dias na geladeira. Deixe inteira o que der e corte só na hora.']);
  if(dow===2) t.push(['Terça de aula','A mentoria vai até 20:30 e você chega esgotado. Deixe a janta pronta antes das 17h e não planeje nada depois.']);
  if(dow===5) t.push(['Preparar o Sábado','O Sábado começa às 18h. Feche pendências até as 17h para entrar no descanso sem dívida mental.']);
  if(TIRED_DOW.includes(dow)&&pl==='A') t.push(['Fase de mais cansaço','De quarta a sábado sua energia cai. Se o dia apertar, mude para o plano B — vale mais que falhar no A.']);
  if(dow===0) t.push(['Domingo','Cardápio livre: repita o que preferir de segunda ou de terça. À tarde, surf ou bike.']);
  const L=life();
  if(L.streak>0&&L.streak>=L.best) t.push(['Sequência','Você está na sua maior sequência até hoje. Se o dia desandar, plano C — mas não zere.']);
  const wt=waterToday();
  if(wt<S.water.goal*0.5&&new Date().getHours()>=14&&iso(TODAY())===k)
    t.push(['Água','Você está em '+(wt/1000).toFixed(1)+'L de '+(S.water.goal/1000)+'L e já passou das 14h. Puxe o ritmo antes da noite.']);
  return t;
}
