/* ═══════════════════════════════════════════════════════
   9d · POMODORO
   Modelo emprestado do produdoro (Java):
     ConfiguracaoPadrao  → S.pomo.cfg      (padrão global)
     ConfiguracaoUsuario → S.pomo.perCat   (override por área)
     StatusUsuario       → run.phase       (FOCO | CURTA | LONGA)
     quantidadePomodorosPausaCurta → run.done (conta até a pausa longa)
     Tarefa.statusAtivacao ATIVA/INATIVA   → uma sessão por vez
   Diferença deliberada: `contagemPomodoro` era um campo gravado.
   Aqui os ciclos são DERIVADOS da duração atual da atividade, então
   encurtar o bloco de trabalho encurta o pomodoro na hora.
   ═══════════════════════════════════════════════════════ */
const PHASE={FOCO:'Foco',CURTA:'Pausa curta',LONGA:'Pausa longa'};

/* Ideias de pausa — nada de tela. Fontes: thevaluedlife.co.uk,
   junoschool.org, facedragons.com                              */
const BREAKS=[
  ['Levante e ande','Uma micro-caminhada de 2 a 4 minutos devolve mais energia que ficar sentado rolando a tela.'],
  ['Respiração 4-7-8','Inspire em 4 tempos, segure 7, solte em 8. Três rodadas derrubam o ruído mental.'],
  ['Alongue o que travou','Pescoço, ombros e punhos. Você passou 25 minutos na mesma posição.'],
  ['Encha a garrafa','Resolve a hidratação do dia sem virar mais uma tarefa.'],
  ['Lave a louça que está ali','Tarefa chata que cabe em 5 minutos e some da sua cabeça.'],
  ['Olhe pra longe','Vinte segundos olhando algo a mais de 6 metros. Seus olhos precisam disso.'],
  ['Uma frase em alemão','Diga em voz alta o que você acabou de fazer. Trinta segundos, sem app.'],
  ['Arrume uma superfície','Uma bancada, uma mesa. Ambiente limpo, cabeça limpa.'],
  ['Escreva a próxima ação','Uma linha: qual é o próximo passo concreto quando o foco voltar.'],
  ['Tome sol na varanda','Luz natural reajusta o sono da noite.'],
  ['Estenda a roupa','Se tem máquina rodando, essa pausa já pagou por si.'],
  ['Fique parado, sem nada','Cinco minutos de tédio consciente. O cérebro consolida o que acabou de aprender.'],
];
const BREAK_NUDGE=[
  'O que olhar o celular agora te aproxima do que você quer?',
  'Cinco minutos de rolagem custam o foco dos próximos vinte e cinco.',
  'A pausa é pra recuperar, não pra trocar de estímulo.',
  'Você fechou um ciclo. Não estrague com dopamina barata.',
  'O celular vai continuar ali. A vontade de estudar, não.',
  'Escolha algo que seja fácil parar quando o timer voltar.',
];

/* Configuração efetiva de uma atividade: override da área > padrão */
function pomoCfg(catId){
  const base=S.pomo.cfg, ov=(S.pomo.perCat||{})[catId];
  return {focus:(ov&&ov.focus)||base.focus, short:(ov&&ov.short)||base.short,
          long:(ov&&ov.long)||base.long, cycles:(ov&&ov.cycles)||base.cycles};
}
/** Quantos ciclos de foco cabem na duração ATUAL da atividade. */
function pomoCycles(dur,cfg){ return Math.max(1,Math.round(dur/(cfg.focus+cfg.short))); }

function pomoStart(v){
  const cfg=pomoCfg(v.cat), n=pomoCycles(v.dur,cfg);
  S.pomo.run={key:v.key, date:v.date, title:v.title, cat:v.cat, dur:v.dur,
    phase:'FOCO', done:0, planned:n, endsAt:Date.now()+cfg.focus*60000,
    paused:false, left:0, breakIdx:Math.floor(Math.random()*BREAKS.length)};
  save(); pomoPaint(); toast(`Foco iniciado — ${cfg.focus} min · ${n} ciclo(s) previsto(s) para "${v.title}".`);
}
function pomoLeft(){
  const r=S.pomo.run; if(!r) return 0;
  return r.paused ? r.left : Math.max(0,Math.round((r.endsAt-Date.now())/1000));
}
function pomoToggle(){
  const r=S.pomo.run; if(!r) return;
  if(r.paused){ r.endsAt=Date.now()+r.left*1000; r.paused=false; }
  else { r.left=pomoLeft(); r.paused=true; }
  save(); pomoPaint();
}
function pomoAdd(min){
  const r=S.pomo.run; if(!r) return;
  if(r.paused) r.left+=min*60; else r.endsAt+=min*60000;
  save(); pomoPaint();
  toast(min>0?`Mais ${min} min. Aproveite que a vontade está aí.`:`${-min} min a menos.`);
}
function pomoStop(){ S.pomo.run=null; save(); pomoPaint(); }
function pomoSkip(){ pomoAdvance(true); }

function pomoAdvance(manual){
  const r=S.pomo.run; if(!r) return;
  const cfg=pomoCfg(r.cat);
  if(r.phase==='FOCO'){
    r.done++;
    S.pomo.total=(S.pomo.total||0)+1;
    S.pomo.log=S.pomo.log||{};
    const k=iso(TODAY()); S.pomo.log[k]=(S.pomo.log[k]||0)+1;
    if(r.done>=r.planned){
      if(!manual) toast(`Você fechou os ${r.planned} ciclos de "${r.title}". Marque a atividade como concluída.`,true);
      const v=inst(pISO(r.date)).find(x=>x.key===r.key);
      if(v&&!v.done) setDone(r.date,r.key,true);
      S.pomo.run=null; save(); pomoPaint(); paint(); return;
    }
    const longa=r.done%cfg.cycles===0;
    r.phase=longa?'LONGA':'CURTA';
    r.endsAt=Date.now()+(longa?cfg.long:cfg.short)*60000;
    r.breakIdx=Math.floor(Math.random()*BREAKS.length);
    r.nudge=BREAK_NUDGE[Math.floor(Math.random()*BREAK_NUDGE.length)];
  } else {
    r.phase='FOCO'; r.endsAt=Date.now()+cfg.focus*60000;
  }
  r.paused=false; save(); pomoPaint();
  if(!manual){ beep();
    notify(r.phase==='FOCO'?'De volta ao foco':'Hora da pausa',
      r.phase==='FOCO'?`Ciclo ${r.done+1} de ${r.planned} — ${r.title}`:BREAKS[r.breakIdx][0]); }
}

/* ── barra flutuante, visível em qualquer aba ── */
function pomoPaint(){
  let el=document.getElementById('pomo');
  const r=S.pomo.run;
  if(!r){ if(el) el.remove(); document.body.classList.remove('haspomo'); return; }
  if(!el){ el=document.createElement('div'); el.id='pomo'; document.body.appendChild(el); }
  document.body.classList.add('haspomo');
  const s=pomoLeft(), cfg=pomoCfg(r.cat);
  const total=(r.phase==='FOCO'?cfg.focus:r.phase==='CURTA'?cfg.short:cfg.long)*60;
  const pct=total?Math.max(0,Math.min(100,(1-s/total)*100)):0;
  const foco=r.phase==='FOCO';
  el.className='pomo'+(foco?'':' brk');
  el.innerHTML=`
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pmain">
      <div class="pclock num">${p2(Math.floor(s/60))}:${p2(s%60)}</div>
      <div class="pinfo">
        <b>${foco?`Foco · ciclo ${r.done+1} de ${r.planned}`:PHASE[r.phase]}</b>
        <span>${foco?esc(r.title):esc(BREAKS[r.breakIdx][0])}</span>
      </div>
      <div class="pacts">
        <button class="b sm line" data-p="t">${r.paused?'Retomar':'Pausar'}</button>
        <button class="b sm line" data-p="+5">+5</button>
        <button class="b sm line" data-p="s">${foco?'Pular p/ pausa':'Voltar ao foco'}</button>
        <button class="b sm" data-p="x">Encerrar</button>
      </div>
    </div>
    ${foco?'':`<div class="pbrk"><b>${esc(BREAKS[r.breakIdx][1])}</b>
      <span>${esc(r.nudge||BREAK_NUDGE[0])}</span></div>`}`;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.p;
    if(a==='t') pomoToggle(); else if(a==='+5') pomoAdd(5);
    else if(a==='s') pomoSkip(); else if(a==='x'){ if(confirm('Encerrar a sessão de foco?')) pomoStop(); }
  });
}
setInterval(()=>{
  const r=S.pomo.run; if(!r||r.paused) return;
  if(pomoLeft()<=0) pomoAdvance(false); else pomoPaint();
},1000);

/* ── painel do pomodoro com a lista de atividades ── */
function pomoModal(preset){
  const draw=()=>{
    const r=S.pomo.run;
    const scope=S.pomo.scope||'day';
    const from=scope==='day'?TODAY():scope==='week'?sow(TODAY()):new Date(TODAY().getFullYear(),TODAY().getMonth(),1);
    const days=scope==='day'?1:scope==='week'?7:new Date(TODAY().getFullYear(),TODAY().getMonth()+1,0).getDate();
    const rows=[];
    for(let i=0;i<days;i++){ const d=addD(from,i);
      inst(d).filter(x=>!x.allDay&&cat(x.cat).track).forEach(x=>rows.push({d,x})); }
    const cfg=preset?pomoCfg(preset.cat):S.pomo.cfg;

    md.innerHTML=`<h3>Foco</h3>
      <p class="hint">O número de ciclos vem da duração atual da atividade. Encurtou o bloco no calendário? O pomodoro encurta junto.</p>
      ${r?`<div class="prun"><div><b>${esc(r.title)}</b>
        <small>${PHASE[r.phase]} · ciclo ${r.done+1} de ${r.planned}</small></div>
        <button class="b sm line" id="pStop">Encerrar</button></div>`:''}
      <div class="row3">
        <label class="fld"><span>Foco (min)</span><input type="number" id="cf" value="${cfg.focus}" min="5" step="5"></label>
        <label class="fld"><span>Pausa curta</span><input type="number" id="cs" value="${cfg.short}" min="1" step="1"></label>
        <label class="fld"><span>Pausa longa</span><input type="number" id="cl3" value="${cfg.long}" min="5" step="5"></label>
      </div>
      <label class="fld"><span>Ciclos até a pausa longa</span><input type="number" id="cc" value="${cfg.cycles}" min="2" max="8"></label>
      ${preset?`<label class="fld" style="display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px">
        <input type="checkbox" id="cSave" style="width:auto"> Guardar como padrão de <b>${esc(cat(preset.cat).label)}</b></label>`:''}
      <div class="pscope">${[['day','Hoje'],['week','Semana'],['month','Mês']].map(([v,n])=>
        `<button class="b sm${scope===v?' on':''}" data-sc="${v}">${n}</button>`).join('')}</div>
      <div class="ptasks">${rows.length?rows.map(({d,x})=>{
        const c=pomoCfg(x.cat), n=pomoCycles(x.dur,c);
        const ativa=r&&r.key===x.key&&r.date===iso(d);
        return `<div class="ptask${x.done?' ok':''}${ativa?' on':''}">
          <i style="background:${cat(x.cat).color}"></i>
          <span class="pt1">${esc(x.title)}<small>${scope!=='day'?DOWS[d.getDay()]+' ':''}${x.start} · ${hhm(x.dur)}</small></span>
          <span class="pt2 num">${n}×${c.focus}min</span>
          <button class="b xs line" data-go="${iso(d)}|${x.key}">${ativa?'em curso':'iniciar'}</button>
        </div>`;}).join(''):'<p class="cx">Nenhuma atividade das suas áreas neste período.</p>'}</div>
      <div class="acts"><button class="b" id="pX">Fechar</button></div>`;

    md.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{S.pomo.scope=b.dataset.sc;save();draw();});
    md.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      const [dk,key]=b.dataset.go.split('|');
      const v=inst(pISO(dk)).find(x=>x.key===key);
      if(v){ pomoStart({...v,date:dk}); shut(); }
    });
    const st=md.querySelector('#pStop'); if(st) st.onclick=()=>{ pomoStop(); draw(); };
    md.querySelector('#pX').onclick=shut;
    ['#cf','#cs','#cl3','#cc'].forEach(sel=>md.querySelector(sel).onchange=()=>{
      const c={focus:+md.querySelector('#cf').value||25, short:+md.querySelector('#cs').value||5,
               long:+md.querySelector('#cl3').value||15, cycles:+md.querySelector('#cc').value||4};
      const sv=md.querySelector('#cSave');
      if(preset&&sv&&sv.checked){ S.pomo.perCat=S.pomo.perCat||{}; S.pomo.perCat[preset.cat]=c; }
      else S.pomo.cfg=c;
      save(); draw();
    });
  };
  draw(); pop();
}

/* ═══════════════════════════════════════════════════════
   9e · PROTOCOLO 180
   Um quadrado por dia. O que já passou fica marcado pelo que
   você fez; o que vem fica em aberto. A projeção mostra onde
   cada área chega no dia 180 em dois cenários: o seu ritmo
   real e o plano cumprido à risca.
   ═══════════════════════════════════════════════════════ */

/** Minutos previstos por semana em cada área, direto do template. */
function weeklyPlanned(){
  const out={}; S.cats.filter(c=>c.track).forEach(c=>out[c.id]=0);
  for(let dw=0;dw<7;dw++) (S.template[dw]||[]).forEach(b=>{
    if(out[b.cat]!==undefined) out[b.cat]+=b.dur; });
  return out;
}
function protoInfo(){
  const P=S.protocol, start=pISO(P.start);
  const elapsed=Math.max(0,Math.round((TODAY()-start)/864e5));      // dias completos
  const dayN=Math.min(P.days,elapsed+1);
  const left=Math.max(0,P.days-dayN);
  const end=addD(start,P.days-1);
  return {start,end,dayN,left,elapsed,pct:Math.round(dayN/P.days*100),done:elapsed>=P.days};
}
/** Estado de cada um dos 180 dias. */
function protoDays(){
  const P=S.protocol, start=pISO(P.start), t=iso(TODAY()), out=[];
  for(let i=0;i<P.days;i++){
    const d=addD(start,i), k=iso(d);
    const o=S.overrides[k]||{}, off=o.off||{};
    const folga=off.m&&off.t&&off.n;
    const st=dayStat(k);
    let s;
    if(k===t) s='hoje';
    else if(d>TODAY()) s='futuro';
    else if(folga) s='folga';
    else if(!st) s='vazio';
    else s=st.rate>=.6?'ok':'fraco';
    out.push({i,d,k,s,st,rate:st?st.rate:0,min:st?st.min:0});
  }
  return out;
}
/** Minutos concluídos por área dentro da janela do protocolo.
    Usar o acumulado de toda a vida aqui inflava a taxa de
    cumprimento, porque comparava um histórico inteiro contra
    os dias corridos do protocolo.                            */
function protoAccum(){
  const h={}; S.cats.filter(c=>c.track).forEach(c=>h[c.id]=0);
  const start=pISO(S.protocol.start), hoje=TODAY();
  Object.keys(S.overrides||{}).forEach(k=>{
    const o=S.overrides[k]; if(!o||!o.done||!Object.keys(o.done).length) return;
    const d=pISO(k); if(d<start||d>hoje) return;
    inst(d).forEach(x=>{ if(x.done&&h[x.cat]!==undefined) h[x.cat]+=x.dur; });
  });
  return h;
}
/** Projeção por área: hoje, no ritmo real e cumprindo o plano. */
function protoProjection(){
  const L={h:protoAccum()}, inf=protoInfo(), wk=weeklyPlanned();
  const semanasRestantes=inf.left/7;
  const semanasCorridas=Math.max(1/7,inf.elapsed/7);
  return S.cats.filter(c=>c.track&&wk[c.id]>0).map(c=>{
    const hoje=L.h[c.id]||0;
    const previstoAteAgora=wk[c.id]*semanasCorridas;
    const taxa=previstoAteAgora>0?Math.min(1.6,hoje/previstoAteAgora):0;
    return {c, hoje,
      ritmo: hoje + wk[c.id]*semanasRestantes*taxa,
      plano: hoje + wk[c.id]*semanasRestantes,
      taxa: previstoAteAgora>0?taxa:null,
      semana: wk[c.id]};
  }).sort((a,b)=>b.plano-a.plano);
}

/* ═══════════════════════════════════════════════════════
   9g · PADRÕES — o que os seus dados dizem sobre você
   Lê o horário EFETIVO de cada bloco (com o que você moveu
   naquele dia), não o horário planejado. Se você empurra a
   leitura da manhã para a noite e só aí cumpre, o sistema
   enxerga a noite como o seu horário real de leitura.
   ═══════════════════════════════════════════════════════ */
const FAIXAS=[[300,540,'de manhã cedo','manha'],[540,720,'no fim da manhã','meiodia'],
  [720,900,'no início da tarde','tarde1'],[900,1080,'no fim da tarde','tarde2'],
  [1080,1260,'no começo da noite','noite1'],[1260,1440,'tarde da noite','noite2']];
const MIN_AMOSTRA=4, MIN_DIF=0.18, MIN_DIAS_DADO=5;
/** Janela real de análise: no máximo o pedido, nunca mais que os
    dias corridos do protocolo, e o texto informa quantos dias
    realmente tinham registro. Prometer 21 dias tendo 13 é mentira. */
function janelaAnalise(pedido){
  const corridos=Math.max(1, protoInfo().elapsed);
  const desdeCriacao=Math.max(1, dSince(S.created)+1);
  const dias=Math.min(pedido||21, corridos, desdeCriacao);
  let comDado=0;
  for(let i=1;i<=dias;i++){
    const o=S.overrides[iso(addD(TODAY(),-i))];
    if(o&&o.done&&Object.keys(o.done).length) comDado++;
  }
  return {dias, comDado};
}

function coleta(dias){
  const base={};                       // cat -> faixa -> {t,d} e cat -> dow -> {t,d}
  const cats=S.cats.filter(c=>c.track).map(c=>c.id);
  cats.forEach(c=>base[c]={faixa:{},dow:{},total:{t:0,d:0}});
  for(let i=1;i<=dias;i++){
    const d=addD(TODAY(),-i), k=iso(d);
    const o=S.overrides[k]; if(!o||!o.done||!Object.keys(o.done).length) continue;
    inst(d).forEach(x=>{
      if(x.fixed||overhead(x)||!base[x.cat]) return;
      const f=FAIXAS.find(([lo,hi])=>t2m(x.start)>=lo&&t2m(x.start)<hi);
      if(!f) return;
      const B=base[x.cat];
      (B.faixa[f[3]]=B.faixa[f[3]]||{t:0,d:0,lab:f[2]});
      (B.dow[d.getDay()]=B.dow[d.getDay()]||{t:0,d:0});
      B.faixa[f[3]].t++; B.dow[d.getDay()].t++; B.total.t++;
      if(x.done){ B.faixa[f[3]].d++; B.dow[d.getDay()].d++; B.total.d++; }
    });
  }
  return base;
}

/** Achados com evidência. Nada é reportado sem amostra mínima. */
function padroes(pedido){
  const J=janelaAnalise(pedido);
  if(J.comDado<MIN_DIAS_DADO) return [];      // dado insuficiente é ruído, não padrão
  const dias=J.dias, B=coleta(dias), out=[];
  const janelaTxt=`em ${J.comDado} ${J.comDado===1?'dia':'dias'} com registro`;
  Object.entries(B).forEach(([cid,v])=>{
    const c=cat(cid);
    const fx=Object.entries(v.faixa).filter(([,x])=>x.t>=MIN_AMOSTRA)
      .map(([k2,x])=>({k:k2,lab:x.lab,rate:x.d/x.t,n:x.t}));
    if(fx.length>=2){
      const melhor=fx.slice().sort((a,b)=>b.rate-a.rate)[0];
      const pior=fx.slice().sort((a,b)=>a.rate-b.rate)[0];
      if(melhor.rate-pior.rate>=MIN_DIF)
        out.push({tipo:'horario', cat:cid, catLabel:c.label, melhor, pior, dias, janela:J,
          texto:`<b>${esc(c.label)}</b> rende <b>${Math.round(melhor.rate*100)}%</b> ${melhor.lab} e só ${Math.round(pior.rate*100)}% ${pior.lab}, ${janelaTxt}.`});
    }
    const dw=Object.entries(v.dow).filter(([,x])=>x.t>=3)
      .map(([k2,x])=>({dow:+k2,rate:x.d/x.t,n:x.t}));
    if(dw.length>=3){
      const pior=dw.slice().sort((a,b)=>a.rate-b.rate)[0];
      const media=dw.reduce((a,b)=>a+b.rate,0)/dw.length;
      if(media-pior.rate>=0.25)
        out.push({tipo:'dia', cat:cid, catLabel:c.label, dow:pior.dow, dias, janela:J,
          texto:`Na <b>${DOWL[pior.dow].toLowerCase()}</b> você cumpre só ${Math.round(pior.rate*100)}% de ${esc(c.label).toLowerCase()}, contra ${Math.round(media*100)}% na média da semana — ${janelaTxt}.`});
    }
  });
  return out;
}

/** Transforma um achado em uma proposta concreta de mudança. */
function proporMudanca(p){
  if(!p||p.tipo!=='horario') return null;
  const alvo=FAIXAS.find(f=>f[3]===p.melhor.k);
  const blocos=[];
  Object.keys(S.template).forEach(dw=>{
    (S.template[dw]||[]).forEach(b=>{
      if(b.cat!==p.cat||b.fixed) return;
      const m=t2m(b.start);
      const fAtual=FAIXAS.find(([lo,hi])=>m>=lo&&m<hi);
      if(fAtual&&fAtual[3]===p.pior.k) blocos.push({dw:+dw,b});
    });
  });
  if(!blocos.length) return null;
  return {padrao:p, alvo, blocos,
    resumo:`Mover ${blocos.length} bloco(s) de ${p.catLabel.toLowerCase()} para ${alvo[2]}`};
}

/* ── semana de teste ───────────────────────────────────
   Aplica a proposta por 7 dias, guarda a linha de base e,
   no fim, mostra o resultado para você decidir.          */
/** Primeiro horário livre dentro da faixa alvo naquele dia da
    semana, sem colidir com nada e sem cair antes de acordar. */
function vagaNaFaixa(dw,bloco,faixa){
  const j=janelaDe(bloco.title);
  const lo=Math.max(faixa[0], t2m(S.wake[dw])+20, j?j.min:0);
  const hi=Math.min(faixa[1], j?j.max:1440);
  const outros=(S.template[dw]||[]).filter(x=>x.id!==bloco.id)
    .map(x=>({s:t2m(x.start),e:t2m(x.start)+x.dur}))
    .concat((S.chores||[]).filter(c=>c.dow===dw||c.dow===null||c.dow===undefined)
      .map(c=>({s:t2m(c.time),e:t2m(c.time)+c.dur})))
    .sort((a,b)=>a.s-b.s);
  const dormir=t2m(S.sleep[dw]);
  for(let t=lo;t+bloco.dur<=Math.min(hi,dormir);t+=5){
    if(!outros.some(o=>t<o.e+3&&o.s<t+bloco.dur+3)) return m2t(t);
  }
  return bloco.start;   // não achou espaço: mantém onde está
}
function iniciarTeste(prop){
  const base={};
  S.cats.filter(c=>c.track).forEach(c=>{ const B=coleta(14)[c.id];
    base[c.id]=B&&B.total.t?B.total.d/B.total.t:null; });
  const antes=prop.blocos.map(({dw,b})=>({dw,id:b.id,start:b.start}));
  prop.blocos.forEach(({dw,b})=>{ b.start=vagaNaFaixa(dw,b,prop.alvo); });
  S.teste={inicio:iso(TODAY()), fim:iso(addD(TODAY(),7)), cat:prop.padrao.cat,
    resumo:prop.resumo, antes, base};
  save(); paint();
  toast(`Semana de teste começou: ${prop.resumo.toLowerCase()}. No dia ${fmtS(addD(TODAY(),7))} eu te mostro o resultado.`,true);
}
function reverterTeste(){
  const t=S.teste; if(!t) return;
  t.antes.forEach(a=>{ const b=(S.template[a.dw]||[]).find(x=>x.id===a.id); if(b) b.start=a.start; });
  S.teste=null; save(); paint();
}
function resultadoTeste(){
  const t=S.teste; if(!t) return null;
  const B=coleta(7)[t.cat];
  const depois=B&&B.total.t?B.total.d/B.total.t:null;
  return {antes:t.base[t.cat], depois, resumo:t.resumo,
    dif: (depois!=null&&t.base[t.cat]!=null)?depois-t.base[t.cat]:null};
}
function testeModal(){
  const t=S.teste, r=resultadoTeste();
  md.innerHTML=`<h3>Semana de teste</h3>
    <p style="font-size:13.5px;margin-bottom:4px"><b>${esc(t.resumo)}</b></p>
    <p class="hint">Começou em ${fmtS(pISO(t.inicio))} e fechou em ${fmtS(pISO(t.fim))}.</p>
    <div class="tres">
      <div><span class="tl2">Antes</span><b>${r.antes!=null?Math.round(r.antes*100)+'%':'—'}</b></div>
      <div><span class="tl2">Na semana de teste</span><b>${r.depois!=null?Math.round(r.depois*100)+'%':'—'}</b></div>
      <div><span class="tl2">Diferença</span><b style="color:${r.dif>0?'var(--good)':r.dif<0?'var(--now)':'var(--ink3)'}">${
        r.dif!=null?(r.dif>0?'+':'')+Math.round(r.dif*100)+' pts':'—'}</b></div>
    </div>
    <p class="cx">${r.dif==null?'Poucos registros para concluir. Você decide pelo que sentiu.'
      :r.dif>0.05?'O novo horário funcionou melhor. Vale manter.'
      :r.dif<-0.05?'O horário antigo era melhor para você. Sugiro voltar.'
      :'Deu praticamente na mesma. Fique com o que for mais confortável.'}</p>
    <div class="acts">
      <button class="b" id="tv">Voltar ao horário antigo</button>
      <button class="b solid" id="tk">Manter o novo</button></div>`;
  md.querySelector('#tk').onclick=()=>{ S.teste=null; save(); shut(); paint(); toast('Novo horário mantido na rotina.'); };
  md.querySelector('#tv').onclick=()=>{ reverterTeste(); shut(); toast('Rotina voltou ao horário anterior.'); };
  pop();

    Nada muda sem você mandar — a semana de teste altera só os horários propostos e depois mostra se valeu.</p></div>`;

/* ═══════════════════════════════════════════════════════
   10 · ALERTAS DE PROGRESSO

const STEPS=[25,50,75,90,100];
function milestone(id,pct,fn){ STEPS.forEach(s=>{ const k=id+':'+s;
  if(pct>=s&&!S.milestones[k]){S.milestones[k]=true;save();toast(fn(s),true);} }); }
const gpct=g=> g.kind==='pct'?(g.pct||0)
  : g.target>0?Math.min(100,Math.round((g.saved||0)/g.target*100)):0;

function alerts(){
  const A=[], add=(id,t,x)=>{ if(!S.dismissed[id])A.push({id,t,x}); };
  const W=weekStats(cur);

  if(sstate!=='file'){
    const dd=S.lastBackup?dSince(S.lastBackup):999;
    if(dd>=7) A.push({id:'bk',t:'bad',x:`Seus dados só existem neste navegador${S.lastBackup?` e o último backup foi há ${dd} dias`:''}. Clique no ponto ao lado de "Fechar dia" para gravar num arquivo.`});
  }
  S.goals.forEach(g=>{
    const p=gpct(g);
    if(g.kind==='fund'&&g.target>0){
      const rest=Math.max(0,g.target-(g.saved||0));
      milestone(g.id,p,s=>`${g.label} passou de ${s}%.${rest>0?' Faltam '+brl(rest)+'.':''}`);
      if(g.date){ const dl=dUntil(g.date);
        if(dl>0&&rest>0) add('f'+g.id,'info',`<b>${esc(g.label)}</b> — faltam ${brl(rest)} em ${dl} dias. Guarde <b>${brl(rest/Math.max(1,dl/30.4))}</b> por mês.`);
        else if(dl<=0&&rest>0) add('fl'+g.id,'bad',`<b>${esc(g.label)}</b> — prazo vencido e faltam ${brl(rest)}.`); }
      if(rest>0&&rest<=g.target*.15) add('fn'+g.id,'win',`Faltam só <b>${brl(rest)}</b> para ${esc(g.label)}.`);
      const el=Math.max(1,dSince(S.created)), rate=(g.saved||0)/el;
      if(rate>0&&rest>0){ const pj=addD(TODAY(),Math.ceil(rest/rate));
        add('fp'+g.id,'info',`No ritmo atual, ${esc(g.label).toLowerCase()} fecha em <b>${fmtS(pj)}/${pj.getFullYear()}</b>.`); }
    }
    if(g.kind==='month'){
      const rest=Math.max(0,(g.target||0)-(g.saved||0));
      milestone('m'+g.id,p,s=>`Poupança do mês em ${s}%.`);
      const n=new Date(), dm=new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1;
      if(rest>0) add('mo','info',`Faltam ${brl(rest)} da meta do mês — ${brl(rest/dm)} por dia nos ${dm} dias restantes.`);
      else add('mo','win',`Meta de poupança do mês batida. Todo real acima disso acelera o apartamento.`);
    }
    if(g.kind==='pct'&&g.date){ const dl=dUntil(g.date);
      if(dl>0) add('p'+g.id,'info',`<b>${esc(g.label)}</b> — ${dl} dias até a data alvo, ${p}% concluído.`); }
  });

  (S.trackers||[]).forEach(t=>{
    const it=t.item||{}; if(!it.title||!it.total)return;
    const left=Math.max(0,it.total-(it.done||0)), p=Math.min(100,Math.round((it.done||0)/it.total*100));
    const today=(t.log||{})[iso(TODAY())]||0;
    milestone('t'+t.id+it.title,p,s=>`"${it.title}" em ${s}%.${left>0?' Faltam '+left+' '+t.unit+'.':''}`);
    if(left<=0){ add('td'+t.id,'win',`Você chegou ao fim de "${esc(it.title)}". Marque como concluído no painel.`); return; }
    if(t.dailyGoal>0){
      const dias=Math.ceil(left/t.dailyGoal);
      if(today>=t.dailyGoal) add('tg'+t.id,'win',`Meta de ${esc(t.label).toLowerCase()} batida hoje: <b>${today}/${t.dailyGoal}</b>. Faltam ${left} ${esc(t.unit)}.`);
      else add('tg'+t.id,'info',`<b>${today}/${t.dailyGoal} ${esc(t.unit)}</b> hoje. Nesse ritmo, "${esc(it.title)}" acaba em <b>${fmtS(addD(TODAY(),dias))}</b>.`);
      const n=Object.keys(t.log||{}).length;
      if(n>=3){ const avg=Object.values(t.log).reduce((a,b)=>a+(+b||0),0)/n;
        if(avg<t.dailyGoal*.7) add('tp'+t.id,'warn',`Sua média real é ${avg.toFixed(1)} ${esc(t.unit)}/dia contra a meta de ${t.dailyGoal}. Suba o ritmo ou baixe a meta pra ela virar verdade.`);
        else if(avg>t.dailyGoal*1.3) add('tp'+t.id,'win',`Média de ${avg.toFixed(1)} ${esc(t.unit)}/dia, acima da meta. Dá pra subir a meta.`); }
    }
    if(left<=(t.dailyGoal||10)*2) add('tn'+t.id,'win',`Faltam só <b>${left} ${esc(t.unit)}</b> para fechar "${esc(it.title)}".`);
  });

  const wk='w'+iso(sow(cur));
  milestone(wk,W.rate,s=>`Semana em ${s}% de conclusão.`);
  if(W.rate>=100) add('w1','win','Semana 100% concluída. Isso é o que separa quem fala de quem faz.');
  else if(W.rate>=80) add('w8','win',`${W.rate}% da semana concluída.`);
  else if(W.rate<40&&new Date().getDay()>=4) add('wl','warn',`Semana em ${W.rate}%. Ainda dá pra virar: escolha 3 blocos e execute hoje.`);

  S.cats.filter(c=>c.track&&c.week>0).forEach(c=>{
    const d=W.done[c.id]||0, p=Math.round(d/c.week*100);
    if(p>=100) add('c'+c.id,'win',`${esc(c.label)}: meta semanal de ${hhm(c.week)} batida.`);
    else if(p>=75) add('c'+c.id,'info',`${esc(c.label)}: faltam ${hhm(c.week-d)} para a meta da semana.`);
  });

  const st=streak();
  if(st>=3) add('st','win',`<b>${st} dias seguidos</b> cumprindo o dia. Quebrar agora custa mais caro do que continuar.`);
  if(S.challenge){
    const left=Math.max(0,S.challenge.days-dSince(S.challenge.start.slice(0,10)));
    add('ch','win',`Desafio <b>${esc(S.challenge.name)}</b>: ${left} dia(s) restante(s).`);
  }
  const n=new Date();
  if(n.getDay()===5&&n.getHours()>=15) add('sb','info','O Sábado começa hoje às 18h. Feche as pendências e entre no descanso sem dívida mental.');
  return A.slice(0,6);
}

function quoteToday(){
  const k=iso(TODAY());
  if(S.pinned&&S.pinned.date===k&&S.pinned.text) return S.pinned.text;
  if(S.quoteDate!==k){
    const p=S.quotes.filter(q=>q!==S.lastQuote);
    S.lastQuote=(p.length?p:S.quotes)[Math.floor(Math.random()*(p.length?p.length:S.quotes.length))]||'';
    S.quoteDate=k; save();
  }
  return S.lastQuote;
}
function nowNext(){
  const n=new Date(), m=n.getHours()*60+n.getMinutes();
  const it=inst(TODAY()).filter(x=>!x.allDay);
  let c=null,x=null;
  it.forEach(v=>{const s=t2m(v.start),e=s+v.dur;
    if(m>=s&&m<e)c=v; if(s>m&&(!x||t2m(x.start)>s))x=v;});
  return {c,x,m};
}
function renderSide(){
  const W=weekStats(cur), {c,x,m}=nowNext(), A=alerts();
  let h=`<div class="quote"><p>${esc(quoteToday())}</p>

      ${c?`<div class="nx">termina em ${hhm(t2m(c.start)+c.dur-m)}</div>`:''}</div>
    <div class="nr"><div class="nl">A seguir</div><div class="nv">${x?esc(x.title):'nada até dormir'}</div>
      ${x?`<div class="nx">${x.start} · em ${hhm(t2m(x.start)-m)}</div>`:''}</div></div>`;

  h+=`<div class="pn"><h3>Metas<button class="b xs" id="gEdit">Editar</button></h3>`;
  if(!S.goals.length) h+='<p style="color:var(--ink3);font-size:12.5px">Nenhuma meta. Clique em Editar.</p>';
  S.goals.forEach(g=>{
    const p=gpct(g); let sub='';
    if(g.kind==='fund'&&g.target>0){
      const rest=Math.max(0,g.target-(g.saved||0)), dl=g.date?dUntil(g.date):null;
      sub=`${brl(g.saved||0)} de ${brl(g.target)}`+(rest>0?` · faltam <b>${brl(rest)}</b>`:'')+
          (dl!==null?(dl>0?` · ${dl} dias`:' · prazo vencido'):'');

    } else if(g.kind==='fund'){ sub='Defina o custo e a data para calcular o quanto guardar por mês';

      sub=`${brl(g.saved||0)} de ${brl(g.target||0)} este mês`+(rest>0?` · faltam <b>${brl(rest)}</b>`:' · batida');

    h+=`<div class="gl" data-g="${g.id}"><div class="gt"><span>${esc(g.label)}</span><span class="gp num">${p}%</span></div>
      <div class="gbar"><i style="width:${p}%"></i></div><div class="gs">${sub}</div></div>`;
  });
  h+='</div>';

  h+=`<div class="pn"><h3>Semana <span class="num" style="color:var(--ink2)">${W.rate}%</span></h3><div class="wkbar">`;
  S.cats.filter(cc=>cc.track&&cc.week>0).forEach(cc=>{
    const d=W.done[cc.id]||0, p=Math.min(100,Math.round(d/cc.week*100));
    h+=`<div class="wr"><div class="wrt"><span>${esc(cc.label)}</span>
      <span class="v">${hhm(d)} de ${hhm(cc.week)}</span></div>

  });
  h+=`</div><div style="font-size:11.5px;color:var(--ink3);margin-top:9px">${W.td} de ${W.t} atividades · ${streak()} dias seguidos</div></div>`;

  h+=`<div class="pn"><h3>Hábitos<button class="b xs" id="tEdit">Editar</button></h3>`;
  (S.trackers||[]).forEach(t=>{

    h+=`<div class="tk"><div class="tt"><span>${esc(t.label)}</span>

        <input type="number" class="num" data-set="${t.id}" value="${today}"></div>`;
    }
    h+='</div>';
  });
  h+='</div>';

  h+=`<div class="pn"><h3>Desafio</h3><div id="chal"></div></div>`;

  if(A.length){ h+='<div class="pn"><h3>Avisos</h3>';
    A.forEach(a=>h+=`<div class="al ${a.t}"><span class="am"></span><span>${a.x}</span><span class="ax" data-x="${a.id}">×</span></div>`);
    h+='</div>'; }

  const side=document.getElementById('side'); side.innerHTML=h;
  side.querySelector('#qOther').onclick=()=>{S.quoteDate='';S.pinned={date:'',text:''};quoteToday();renderSide();};
  side.querySelector('#qLib').onclick=quotesModal;
  side.querySelector('#gEdit').onclick=goalsModal;
  side.querySelector('#tEdit').onclick=trackersModal;
  side.querySelectorAll('.gl').forEach(e=>e.onclick=()=>goalModal(e.dataset.g));
  side.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{S.dismissed[e.dataset.x]=true;save();renderSide();});
  side.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const [id,n]=b.dataset.add.split(':'); const t=trk(id);
    logUnits(t,((t.log||{})[iso(TODAY())]||0)+ +n, iso(TODAY())); paint(); });
  side.querySelectorAll('[data-set]').forEach(i=>i.onchange=()=>{
    logUnits(trk(i.dataset.set),Math.max(0,+i.value||0), iso(TODAY())); paint(); });
  renderChal();
}
function logUnits(t,n,k){
  k=k||iso(TODAY()); t.log=t.log||{};
  const prev=t.log[k]||0; t.log[k]=n; if(!n)delete t.log[k];
  t.item.done=Math.max(0,(t.item.done||0)+(n-prev));
  if(t.item.total>0&&t.item.done>t.item.total) t.item.done=t.item.total;
  save();
}
function finishItem(t){
  const it=t.item||{};
  if(!it.title){alert('Cadastre um '+t.itemLabel+' primeiro.');return;}
  t.archive=t.archive||[];
  t.archive.push({title:it.title,total:it.total||it.done,finished:iso(TODAY()),
    days:Math.max(1,dSince(it.startedISO||S.created)+1)});
  toast(`"${it.title}" concluído. ${t.itemLabel[0].toUpperCase()+t.itemLabel.slice(1)} nº ${t.archive.length}.`,true);
  t.item={title:'',total:0,done:0,startedISO:iso(TODAY())};
  save(); paint();
}

/* Observações automáticas do card: o que comer nesta refeição,
   o que levar nesta compra, o que rende este bloco de foco.  */
function detalheDa(d, v){
  if(!v) return '';
  const dia=pISO(d.date), grp=dietGroup(dia);
  const nome=d.title||'';
  if(cat(d.cat).id==='refeicao'&&grp){
    const alvo=(DIET[grp]||[]).find(([m])=>{
      const a=m.toLowerCase(), b=nome.toLowerCase();
      return b.includes(a.split(' ')[0]) || a.includes(b.split(' ')[0]);
    });
    if(alvo) return `<b>${esc(alvo[0])} · cardápio ${grp}</b><ul>${alvo[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(/pré-treino/i.test(nome)) return `<b>Antes do treino</b><ul><li>Fruta leve, ${grp==='A'?'melão':'mamão'} — cerca de 45 min antes de treinar.</li></ul>`;
  }
  if(cat(d.cat).track&&!d.allDay){
    const cfg=pomoCfg(d.cat), n=pomoCycles(d.dur,cfg);
    return `<b>Foco</b><ul><li>Rende ${n} ciclo(s) de ${cfg.focus} min com pausas de ${cfg.short}.</li></ul>`;
  }
  if(/banho|vestir|voltar|arrumar|sair/i.test(nome))
    return `<b>Bloco de apoio</b><ul><li>Existe para o dia caber de verdade. Não conta como tarefa.</li></ul>`;
  return '';
}

    <div class="row3">
      <label class="fld"><span>Início</span><input type="time" id="fS" value="${d.start}" step="300" ${d.allDay?'disabled':''}></label>
      <label class="fld"><span>Fim</span><input type="time" id="fE" value="${m2t(t2m(d.start)+d.dur)}" step="300" ${d.allDay?'disabled':''}></label>
      <label class="fld"><span>Duração</span><input id="fDur" value="${hhm(d.dur)}" disabled></label>
    </div>
    <label class="fld"><span>Categoria</span><div class="chips" id="fC"></div></label>
    <div class="row2">
      <label class="fld"><span>Avisar antes</span>
        <select id="fA">
          <option value="" ${d.alert===null||d.alert===undefined?'selected':''}>usar o padrão da área</option>
          <option value="off" ${d.alert===-1?'selected':''}>não avisar</option>
          ${[0,5,10,15,30,60,120].map(n=>`<option value="${n}" ${d.alert===n?'selected':''}>${n===0?'na hora':n<60?n+' min':(n/60)+'h'}</option>`).join('')}
        </select></label>
      <label class="fld"><span>Dia todo</span>
        <div style="padding-top:7px"><input type="checkbox" id="fAll" ${d.allDay?'checked':''}> lembrete sem horário</div></label>
    </div>
    <div class="row2">
      <label class="fld"><span>Nível</span><select id="fL">${[3,2,1].map(n=>
        `<option value="${n}" ${(d.lv===undefined?2:d.lv)===n?'selected':''}>${LV_NAME[n]} — ${LV_HINT[n]}</option>`).join('')}</select></label>
      <label class="fld"><span>Duração no plano C</span><input type="number" id="fLo" value="${d.durLow||''}" placeholder="cheia" min="5" step="5"></label>
    </div>
    <label class="fld"><span>Nota</span><input id="fN" value="${esc(d.note)}" placeholder="opcional"></label>
    ${isNew?`<label class="fld"><span>Repetição</span>
       <select id="fR"><option value="">só nesta data</option>
       <option value="dow">toda ${DOWL[pISO(d.date).getDay()].toLowerCase()}</option></select></label>`:''}
    ${isTpl?`<label class="fld"><span>Aplicar a</span><div class="scope" id="fSc">
       <div class="sc on" data-s="one">Só neste dia<small>cria uma exceção em ${fmtS(pISO(d.date))}</small></div>
       <div class="sc" data-s="dow">Toda ${DOWL[pISO(d.date).getDay()].toLowerCase()}<small>altera a rotina deste dia da semana</small></div>
       ${sameName>1?`<div class="sc" data-s="all">Todas as ocorrências<small>${sameName} atividades chamadas "${esc(d.title)}" na semana</small></div>`:''}
     </div></label>`:''}
    ${!isNew?`<div class="qacts">
      ${overhead(v)?'<span class="cx" style="margin:0;align-self:center">Bloco de apoio: ocupa tempo na agenda, mas não entra na contagem de tarefas.</span>':`<button class="b line big" id="fDone">${v.done?'✓ Concluída — desmarcar':'Marcar como concluída'}</button>`}
      ${cat(d.cat).track?`<button class="b line big" id="fPomo">Iniciar foco · ${pomoCycles(d.dur,pomoCfg(d.cat))}× ${pomoCfg(d.cat).focus}min</button>`:''}
    </div>`:''}
    <div class="acts">
      ${!isNew?`<button class="b danger left" id="fDel">Remover</button>`:''}
      <button class="b" id="fX">Cancelar</button>
      <button class="b solid" id="fOk">Salvar</button></div>`;

  let c=d.cat, scope='one';
  const cp=md.querySelector('#fC');
  S.cats.forEach(k=>{ const b=document.createElement('button');
    b.className='chip'+(k.id===c?' on':''); b.type='button';
    b.innerHTML=`<i style="background:${k.color}"></i>${esc(k.label)}`;
    b.onclick=()=>{c=k.id;cp.querySelectorAll('.chip').forEach(z=>z.classList.remove('on'));b.classList.add('on');};
    cp.appendChild(b); });
  const sc=md.querySelector('#fSc');
  if(sc) sc.querySelectorAll('.sc').forEach(e=>e.onclick=()=>{
    scope=e.dataset.s; sc.querySelectorAll('.sc').forEach(z=>z.classList.remove('on')); e.classList.add('on'); });

  const fS=md.querySelector('#fS'), fE=md.querySelector('#fE'), fDur=md.querySelector('#fDur');
  const calc=()=>{ let n=t2m(fE.value)-t2m(fS.value); if(n<=0)n+=1440; fDur.value=hhm(n); return n; };
  fS.onchange=()=>{ if(t2m(fE.value)<=t2m(fS.value)) fE.value=m2t(Math.min(1439,t2m(fS.value)+60)); calc(); };
  fE.onchange=calc;
  md.querySelector('#fAll').onchange=e=>{fS.disabled=fE.disabled=e.target.checked;};
  md.querySelector('#fX').onclick=shut;

  const bDone=md.querySelector('#fDone');
  if(bDone) bDone.onclick=()=>{ setDone(v.date,v.key,!v.done); shut(); paint(); };
  const bPomo=md.querySelector('#fPomo');
  if(bPomo) bPomo.onclick=()=>{ shut(); pomoModal(v); };
  const del=md.querySelector('#fDel');
  if(del) del.onclick=()=>comDesfazer(`"${d.title}" removida`,()=>{
    if(v.src==='b'){
      if(scope==='one') ov(d.date).skips.push(v.sid);
      else if(scope==='dow'){ const dw=pISO(d.date).getDay();
        S.template[dw]=S.template[dw].filter(b=>b.id!==v.sid); }
      else { Object.keys(S.template).forEach(dw=>{
        S.template[dw]=S.template[dw].filter(b=>b.title!==v.title); }); }
    } else if(v.src==='e') S.events=S.events.filter(x=>x.id!==v.sid);
    else if(v.src==='r'){ if(confirm('Remover só esta ocorrência? Cancele para remover a série toda.')) ov(d.date).skips.push(v.sid);
      else S.recurring=S.recurring.filter(r=>r.id!==v.sid); }
    save(); shut(); paint();
  });

  md.querySelector('#fOk').onclick=()=>{
    const t=md.querySelector('#fT').value.trim();
    if(!t){alert('Dá um título pra atividade.');return;}
    const _desc=isNew?`"${t}" criada`:`"${t}" alterada`;
    const _antes=fotografia();
    const allDay=md.querySelector('#fAll').checked;
    const nd=md.querySelector('#fD').value, ns=fS.value||'09:00';
    const ndur=allDay?60:calc();
    const note=md.querySelector('#fN').value;
    const _av=md.querySelector('#fA').value;
    const av = _av===''?null : _av==='off'?-1 : +_av;
    const lv=+md.querySelector('#fL').value||2;
    const lo=+md.querySelector('#fLo').value||null;

    if(isNew){
      const rep=md.querySelector('#fR').value;
      if(rep==='dow'){ const dw=pISO(nd).getDay();
        S.template[dw].push({id:uid('b'),start:ns,dur:ndur,title:t,cat:c,fixed:false,trk:null,alert:av,lv,durLow:lo}); }
      else S.events.push({id:uid('e'),date:nd,start:ns,dur:ndur,title:t,cat:c,note,allDay,alert:av,lv});
    } else if(v.src==='e'){
      Object.assign(S.events.find(x=>x.id===v.sid),{date:nd,start:ns,dur:ndur,title:t,cat:c,note,allDay,alert:av,lv});
    } else if(v.src==='r'){
      const r=S.recurring.find(x=>x.id===v.sid);
      if(r){ r.label=t; r.cat=c; r.start=ns; r.dur=ndur; r.alert=av; r.lv=lv; }
    } else {
      if(scope==='one'){
        ov(v.date).skips.push(v.sid);
        S.events.push({id:uid('e'),date:nd,start:ns,dur:ndur,title:t,cat:c,note,allDay,alert:av,
          trk:v.trk||null});
      } else if(scope==='dow'){
        const b=(S.template[pISO(v.date).getDay()]||[]).find(x=>x.id===v.sid);
        if(b) Object.assign(b,{start:ns,dur:ndur,title:t,cat:c,alert:av,lv,durLow:lo});
      } else {
        let n=0; Object.keys(S.template).forEach(dw=>S.template[dw].forEach(b=>{
          if(b.title===v.title){ b.start=ns; b.dur=ndur; b.title=t; b.cat=c; b.alert=av; b.lv=lv; b.durLow=lo; n++; } }));
        toast(`${n} ocorrências de "${t}" atualizadas.`);
      }
    }
    save(); shut(); paint();
    _undo={antes:_antes,descricao:_desc};
    clearTimeout(_undoTimer); _undoTimer=setTimeout(()=>{_undo=null;pintaUndo();},15000); pintaUndo();
  };
  pop();
  setTimeout(()=>md.querySelector('#fT').focus(),40);
}

    S.goals.forEach(g=>{ const r=document.createElement('div'); r.className='li';
      r.innerHTML=`<span class="lg">${esc(g.label)}</span>
        <span style="font-size:11px;color:var(--ink3)">${g.kind==='fund'?'valor':g.kind==='month'?'mensal':'progresso'}</span>

function goalModal(id){
  const g=S.goals.find(x=>x.id===id); if(!g)return;
  md.innerHTML=`<h3>${esc(g.label)}</h3>
    <label class="fld"><span>Nome</span><input id="a" value="${esc(g.label)}"></label>
    <label class="fld"><span>Tipo</span><select id="k">
      <option value="fund" ${g.kind==='fund'?'selected':''}>Valor a juntar (com data alvo)</option>
      <option value="month" ${g.kind==='month'?'selected':''}>Meta mensal recorrente</option>
      <option value="pct" ${g.kind==='pct'?'selected':''}>Progresso em %</option></select></label>
    <div id="bx"></div>
    <label class="fld"><span>Nota</span><input id="n" value="${esc(g.note||'')}"></label>
    <div class="acts"><button class="b danger left" id="del">Remover</button>
      <button class="b" id="x">Cancelar</button><button class="b solid" id="ok">Salvar</button></div>`;
  const bx=md.querySelector('#bx'), ks=md.querySelector('#k');
  const drawBody=()=>{ const k=ks.value;
    bx.innerHTML = k==='pct'
      ? `<div class="row2"><label class="fld"><span>Progresso %</span><input type="number" id="p" value="${g.pct||0}" min="0" max="100"></label>
         <label class="fld"><span>Data alvo</span><input type="date" id="dt" value="${g.date||''}"></label></div>`
      : k==='month'
      ? `<div class="row2"><label class="fld"><span>Meta do mês (R$)</span><input type="number" id="tg" value="${(g.target||0)/100}"></label>
         <label class="fld"><span>Guardado (R$)</span><input type="number" id="sv" value="${(g.saved||0)/100}"></label></div>`
      : `<div class="row2"><label class="fld"><span>Custo total (R$)</span><input type="number" id="tg" value="${(g.target||0)/100}"></label>
         <label class="fld"><span>Já guardado (R$)</span><input type="number" id="sv" value="${(g.saved||0)/100}"></label></div>
         <label class="fld"><span>Data alvo</span><input type="date" id="dt" value="${g.date||''}"></label>
         <p class="hint">Com custo e data preenchidos o painel calcula sozinho quanto guardar por mês.</p>`;
  };
  drawBody(); ks.onchange=drawBody;
  md.querySelector('#x').onclick=shut;
  md.querySelector('#del').onclick=()=>{ if(!confirm('Remover esta meta?'))return;
    S.goals=S.goals.filter(x=>x.id!==id); save(); shut(); paint(); };
  md.querySelector('#ok').onclick=()=>{
    g.label=md.querySelector('#a').value.trim()||'Meta'; g.kind=ks.value;
    g.note=md.querySelector('#n').value;
    const q=s=>md.querySelector(s);
    if(g.kind==='pct'){ g.pct=Math.max(0,Math.min(100,+q('#p').value||0)); g.date=q('#dt').value; }
    else { g.target=Math.round((+q('#tg').value||0)*100); g.saved=Math.round((+q('#sv').value||0)*100);
           if(q('#dt')) g.date=q('#dt').value; }
    save(); shut(); paint(); };
  pop();
}

      <label class="fld"><span>Nome do hábito</span><input id="a" value="${esc(t.label)}"></label>

    <div class="acts">

  md.querySelector('#x').onclick=shut;

/* ── frases ── */
function quotesModal(){
  md.innerHTML=`<h3>Minhas frases</h3>
    <p class="hint">O sistema sorteia uma por dia sem repetir a anterior. Fixe uma para escolher a de hoje.</p>
    <div class="lst" id="ql" style="max-height:300px;overflow-y:auto"></div>

    <div class="acts"><button class="b solid" id="qX">Pronto</button></div>`;
  const l=md.querySelector('#ql'), k=iso(TODAY());
  const draw=()=>{ l.innerHTML='';
    S.quotes.forEach((q,i)=>{ const pin=S.pinned&&S.pinned.date===k&&S.pinned.text===q;
      const r=document.createElement('div'); r.className='li';
      r.innerHTML=`<span class="lg" style="font-size:12.5px">${esc(q)}</span>
        <button class="b xs${pin?' on':''}" data-p="${i}" title="usar hoje">${pin?'hoje':'fixar'}</button>
        <button class="b xs danger" data-d="${i}">×</button>`;
      l.appendChild(r); });
    l.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const q=S.quotes[+b.dataset.p];
      S.pinned=(S.pinned&&S.pinned.text===q&&S.pinned.date===k)?{date:'',text:''}:{date:k,text:q};
      save(); draw(); renderSide(); });
    l.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      comDesfazer('Frase removida',()=>{ S.quotes.splice(+b.dataset.d,1); save(); draw(); renderSide(); }); });
  };
  draw();
  const add=()=>{ const v=md.querySelector('#qn').value.trim();
    if(!v)return; S.quotes.push(v); md.querySelector('#qn').value=''; save(); draw(); renderSide(); };
  md.querySelector('#qA').onclick=add;
  md.querySelector('#qn').onkeydown=e=>{if(e.key==='Enter')add();};

}

/** instâncias simulando um plano, sem alterar o estado */
function inst2(d,pl){
  const k=iso(d), o=ovR(k), save0=o.plan;
  if(S.overrides[k]) S.overrides[k].plan=pl;
  else S.overrides[k]={off:{m:0,t:0,n:0},done:{},moves:{},skips:[],plan:pl};
  const r=inst(d);
  if(save0===undefined){ if(Object.keys(S.overrides[k].done).length===0&&!S.overrides[k].skips.length
      &&!Object.keys(S.overrides[k].moves).length&&!S.overrides[k].off.m&&!S.overrides[k].off.t&&!S.overrides[k].off.n)
      delete S.overrides[k]; else delete S.overrides[k].plan; }
  else S.overrides[k].plan=save0;
  return r;
}

/* ── dias em aberto: cobrança que não some sozinha ── */
function diasEmAberto(){
  const out=[], ini=pISO(S.protocol?S.protocol.start:S.created);
  for(let i=1;i<=14;i++){
    const d=addD(TODAY(),-i); if(d<ini) break;
    const k=iso(d), o=S.overrides[k]||{}, off=o.off||{};
    if(off.m&&off.t&&off.n) continue;              // folga assumida não precisa fechar
    if(!(S.closed||{})[k]) out.push(k);
  }
  return out.reverse();
}
function livroAcabando(){
  for(const t of (S.trackers||[])){
    const it=t.item||{}; if(!it.title||!it.total||!t.dailyGoal) continue;
    const left=Math.max(0,it.total-(it.done||0));
    if(left<=Math.max(20,t.dailyGoal*2)) return {id:t.id,titulo:it.title,left,unit:t.unit};
  }
  return null;
}
function nagBar(){
  const pend=diasEmAberto();
  let el=document.getElementById('nag');

  if(!pend.length&&livro){
    if(!el){ el=document.createElement('div'); el.id='nag';
      document.body.insertBefore(el, document.querySelector('.shell')); }
    document.body.classList.add('hasnag');

    el.innerHTML=`<span class="nb">${livro.left===0?'Livro terminado':'Faltam '+livro.left+' páginas'}</span>
      <span class="nt">${livro.left===0
        ? `Você chegou ao fim de <b>${esc(livro.titulo)}</b>. Feche-o e escolha o próximo — estante vazia é hábito que morre.`
        : `<b>${esc(livro.titulo)}</b> está acabando. Já vale decidir qual vem depois.`}</span>
      <button class="b sm" id="nagLivro">${livro.left===0?'Concluir e escolher':'Escolher o próximo'}</button>`;
    el.querySelector('#nagLivro').onclick=()=>trackerModal(livro.id);

  }

/* ── fechar o dia ── */
function closeDayModal(dISO){
  const k=dISO||iso(TODAY()), dRef=pISO(k), hoje=k===iso(TODAY());
  const it=inst(dRef).filter(x=>!x.fixed&&!overhead(x));
  const dn=it.filter(x=>x.done).length, rate=it.length?Math.round(dn/it.length*100):0;
  const prev=(S.closed||{})[k]||{};
  md.innerHTML=`<h3>Fechar ${fmtL(dRef)}${hoje?'':' <span style="font-weight:400;color:var(--ink3);font-size:13px">(retroativo)</span>'}</h3>
    <div class="gbar" style="height:5px"><i style="width:${rate}%"></i></div>
    <p style="font-size:12.5px;color:var(--ink3);margin:7px 0 16px">${dn} de ${it.length} atividades concluídas · ${rate}%</p>
    ${(S.trackers||[]).filter(t=>t.item&&t.item.title).map(t=>
      `<label class="fld"><span>${esc(t.unit)} de ${esc(t.label).toLowerCase()} hoje</span>
        <input type="number" data-u="${t.id}" value="${(t.log||{})[k]||0}" min="0"></label>`).join('')}
    <label class="fld"><span>Uma linha sobre hoje</span>
      <input id="cn" value="${esc(prev.note||'')}" placeholder="o que funcionou, o que atrapalhou"></label>
    <div class="acts"><button class="b" id="cx">Cancelar</button><button class="b solid" id="co">Fechar dia</button></div>`;
  md.querySelector('#cx').onclick=shut;
  md.querySelector('#co').onclick=()=>{
    md.querySelectorAll('[data-u]').forEach(i=>logUnits(trk(i.dataset.u),Math.max(0,+i.value||0),k));
    S.closed=S.closed||{}; S.closed[k]={rate,note:md.querySelector('#cn').value};
    save(); shut(); paint();
    if(hoje) setTimeout(tomorrowModal,400);
    const L=life();
    toast(rate>=80?`Dia fechado em ${rate}%. Sequência: ${L.streak} dias. É assim que se constrói.`
         :rate>=50?`Dia fechado em ${rate}%. Amanhã você sobe essa barra.`
         :`Dia fechado em ${rate}%. Um dia fraco não apaga o histórico — só apaga se virar rotina.`,true);
  };
  pop();
}

/* ═══════════════════════════════════════════════════════
   13 · AVISOS DE EVENTO (som + notificação)
   ═══════════════════════════════════════════════════════ */
let actx=null;
function beep(){
  if(!S.alerts.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [0,.16].forEach((d,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=i?740:588;
      g.gain.setValueAtTime(0,actx.currentTime+d);
      g.gain.linearRampToValueAtTime(.18,actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.3);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.32);
    });
  }catch(e){}
}
/* ── Notificações do sistema ────────────────────────────
   Aparecem na área de notificação do Windows mesmo com o
   navegador em segundo plano, desde que ele esteja aberto.
   Aviso é definido por ÁREA (idioma, estudo…), e um bloco
   específico pode ter o seu próprio.                       */
const NOTIF_OK=()=>typeof Notification!=='undefined';
const notifEstado=()=>!NOTIF_OK()?'indisponivel':Notification.permission;

function askNotify(){
  if(!NOTIF_OK()) return Promise.resolve('indisponivel');
  if(Notification.permission!=='default') return Promise.resolve(Notification.permission);
  return Notification.requestPermission().then(p=>{ paint(); return p; });
}
function notify(title,body,forte){
  try{
    if(!NOTIF_OK()||Notification.permission!=='granted') return null;
    const n=new Notification(title,{body, tag:title, renotify:true,
      requireInteraction:!!forte, silent:false});
    n.onclick=()=>{ try{ window.focus(); }catch(e){} n.close(); };
    if(!forte) setTimeout(()=>{try{n.close();}catch(e){}}, 25000);
    return n;
  }catch(e){ return null; }
}

/** Antecedência efetiva: do bloco, senão da área, senão nenhuma. */
function leadDe(v){
  if(v.alert===-1) return null;
  if(v.alert!==null&&v.alert!==undefined) return v.alert;
  const c=cat(v.cat);
  return (c.alertLead===null||c.alertLead===undefined)?null:c.alertLead;
}

const fired=new Set();
let _ultimoTick=null;
function checkAlerts(){
  if(!S.alerts.on) return;
  const n=new Date(), m=n.getHours()*60+n.getMinutes(), k=iso(TODAY());
  /* O navegador estrangula timers em aba de fundo (chega a 1/min).
     Por isso não comparamos minuto exato: disparamos tudo que
     venceu desde a última verificação.                          */
  const desde = _ultimoTick===null ? m-1 : _ultimoTick;
  _ultimoTick=m;
  if(m<desde) fired.clear();                 // virou o dia

  inst(TODAY()).forEach(v=>{
    if(v.allDay||v.done||overhead(v)) return;
    const lead=leadDe(v);
    if(lead===null) return;
    const at=t2m(v.start)-lead;
    const id=k+'|'+v.key+'|'+at;
    if(at>desde && at<=m && !fired.has(id)){
      fired.add(id); beep();
      const quando = lead===0 ? 'Começa agora' : `Começa em ${lead<60?lead+' min':(lead/60)+'h'}`;
      const corpo=`${quando} · ${v.start}–${m2t(t2m(v.start)+v.dur)} · ${hhm(v.dur)}`;
      notify(v.title, corpo, lead<=10);
      toast(`<b>${esc(v.title)}</b><br>${corpo}`,true);
    }
  });
}
setInterval(checkAlerts,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkAlerts(); });

/* ═══════════════════════════════════════════════════════
   15 · NUVEM — Supabase
   Um documento por usuário. Toda a agregação continua no
   cliente, então não há motivo para um schema relacional:
   o estado inteiro cabe em ~20 KB.

   Conflito entre dois aparelhos:
     · estrutura (rotina, metas, áreas) → vence o mais recente
     · registros (conclusões, água, leitura, dias fechados)
       → UNIÃO, nunca sobrescrita. É o dado que dói perder.
   ═══════════════════════════════════════════════════════ */
const APP_VER='2026-08-16.2';
const CLOUD_KEY='planner_cloud';
let sb=null, sbUser=null, cloudState='off', cloudTimer=null, cloudPending=false, provs=null;

/** Reconhece chave de servidor, que jamais pode ir para o navegador. */
function perigosa(k){
  if(/^sb_secret_/i.test(k)) return true;
  try{ const p=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(p && p.role && p.role!=='anon') return true; }catch(e){}
  return false;
}
function cloudCfg(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null'); }catch(e){ return null; }
}
function setCloudCfg(c){
  if(c) localStorage.setItem(CLOUD_KEY,JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY);
}

/** Pergunta ao projeto quais formas de entrada estão habilitadas.
    Sem isso o app oferece um botão que devolve erro 400.        */
async function cloudProvs(url){
  try{
    const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:cloudCfg().key}});
    if(!r.ok) return null;
    const j=await r.json();
    return {google:!!(j.external&&j.external.google),
            email:!(j.external&&j.external.email===false)};
  }catch(e){ return null; }
}

async function cloudInit(){
  const c=cloudCfg();
  if(!c||!c.url||!c.key||!window.supabase){ cloudState='off'; paintCloud(); return; }
  try{
    sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    provs=await cloudProvs(c.url);
    const {data}=await sb.auth.getSession();
    sbUser=data.session?data.session.user:null;
    cloudState=sbUser?'on':'anon';
    sb.auth.onAuthStateChange((_e,sess)=>{
      sbUser=sess?sess.user:null;
      cloudState=sbUser?'on':'anon';
      paintCloud();
      if(sbUser) cloudPull();
    });
    paintCloud();
    if(sbUser) await cloudPull();
  }catch(e){ console.warn('cloudInit',e); cloudState='erro'; paintCloud(); }
}

/** União dos registros; o resto segue o documento mais novo. */
function mergeEstado(local,remoto,remotoMaisNovo){
  const base = remotoMaisNovo ? JSON.parse(JSON.stringify(remoto)) : JSON.parse(JSON.stringify(local));
  const outro = remotoMaisNovo ? local : remoto;

  // overrides: une por data e, dentro do dia, une as conclusões
  base.overrides=base.overrides||{};
  Object.entries(outro.overrides||{}).forEach(([k,o])=>{
    const b=base.overrides[k];
    if(!b){ base.overrides[k]=o; return; }
    b.done=Object.assign({},o.done||{},b.done||{});
    b.skips=[...new Set([...(b.skips||[]),...(o.skips||[])])];
    b.moves=Object.assign({},o.moves||{},b.moves||{});
    b.off=b.off||o.off;
    if(!b.plan&&o.plan) b.plan=o.plan;
  });
  // registros acumulativos: soma de chaves, mantendo o maior valor
  const uniMax=(a,b)=>{ const r=Object.assign({},a||{});
    Object.entries(b||{}).forEach(([k,v])=>{ r[k]=Math.max(+r[k]||0,+v||0); }); return r; };
  base.closed=Object.assign({},outro.closed||{},base.closed||{});
  base.milestones=Object.assign({},outro.milestones||{},base.milestones||{});
  if(base.water&&outro.water) base.water.log=uniMax(base.water.log,outro.water.log);
  (base.trackers||[]).forEach(t=>{
    const o=(outro.trackers||[]).find(x=>x.id===t.id); if(!o) return;
    t.log=uniMax(t.log,o.log);
    const vistos=new Set((t.archive||[]).map(x=>x.title+x.finished));
    (o.archive||[]).forEach(x=>{ if(!vistos.has(x.title+x.finished)) (t.archive=t.archive||[]).push(x); });
  });
  const ch=new Set((base.chalDone||[]).map(x=>x.name+x.finished));
  (outro.chalDone||[]).forEach(x=>{ if(!ch.has(x.name+x.finished)) (base.chalDone=base.chalDone||[]).push(x); });
  base.bestStreak=Math.max(base.bestStreak||0,outro.bestStreak||0);
  return base;
}

async function cloudPull(silencioso){
  if(!sb||!sbUser) return;
  try{
    const {data,error}=await sb.from('estado').select('dados,atualizado_em').eq('user_id',sbUser.id).maybeSingle();
    if(error) throw error;
    if(!data){ await cloudPush(true); return; }          // primeiro acesso: sobe o que existe aqui
    const antes=JSON.stringify(S);
    const remoto=data.dados, localTs=S.atualizado||0;
    const remotoTs=new Date(data.atualizado_em).getTime();
    S=mergeEstado(S,remoto,remotoTs>localTs);
    const mudou=JSON.stringify(S)!==antes;
    S.atualizado=Math.max(localTs,remotoTs);
    localStorage.setItem(LS,JSON.stringify(S));
    if(mudou){ paint(); if(!silencioso) toast('Dados sincronizados.'); }
    _ultPull=Date.now();
  }catch(e){ console.warn('cloudPull',e); cloudState='erro'; paintCloud(); }
}

async function cloudPush(silencioso){
  if(!sb||!sbUser) return;
  cloudPending=true; paintCloud();
  try{
    S.atualizado=Date.now();
    const {error}=await sb.from('estado').upsert({user_id:sbUser.id,dados:S,atualizado_em:new Date().toISOString()});
    if(error) throw error;
    cloudPending=false; cloudState='on'; paintCloud();
    if(!silencioso) return true;
  }catch(e){ console.warn('cloudPush',e); cloudPending=false; cloudState='erro'; paintCloud(); }
}
function cloudAgenda(){
  if(!sb||!sbUser) return;
  clearTimeout(cloudTimer);
  cloudPending=true; paintCloud();
  cloudTimer=setTimeout(()=>cloudPush(true),2500);
}
window.addEventListener('online',()=>{ if(sbUser){ cloudPush(true); cloudPull(true); } });

    if(!confirm('Desconectar da nuvem? Os dados continuam neste aparelho.'))return;
    setCloudCfg(null); sb=null; sbUser=null; cloudState='off'; shut(); paintCloud(); };
  md.querySelector('#cOk').onclick=async()=>{
    const url=md.querySelector('#cU').value.trim().replace(/\/+$/,'');
    const key=md.querySelector('#cK').value.trim();
    if(!url||!key){ alert('Preencha a URL e a chave.'); return; }
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)){
      if(!confirm('Esse endereço não parece o de um projeto Supabase\n(https://xxxx.supabase.co).\n\nContinuar mesmo assim?')) return; }
    if(perigosa(key)){
      alert('Essa é uma chave de SERVIDOR (secret / service_role).\n\n'+
        'Ela ignora todas as regras de segurança do banco — qualquer pessoa que abrisse o site poderia ler e apagar tudo.\n\n'+
        'Volte ao Supabase e copie a chave pública: "Publishable key" (sb_publishable_...) ou a "anon / public" na aba de chaves legadas.');
      return; }
    setCloudCfg({url,key}); shut();
    await cloudInit();
    if(sb&&!sbUser) cloudLogin();
  };
  pop();
}

/* ── Desfazer ──────────────────────────────────────────
   Toda ação que mexe na estrutura tira uma fotografia antes.
   Some sozinho em 15s; enquanto está ali, um clique volta tudo. */
const CAMPOS_UNDO=['template','events','overrides','chores','recurring','cats','trackers',
                   'goals','quotes','sleep','wake','protocol','teste','closed'];
let _undo=null, _undoTimer=null;
function fotografia(){
  const o={}; CAMPOS_UNDO.forEach(k=>o[k]=JSON.parse(JSON.stringify(S[k]!==undefined?S[k]:null)));
  return o;
}
function comDesfazer(descricao, fn){
  const antes=fotografia();
  fn();
  _undo={antes, descricao};
  clearTimeout(_undoTimer);
  _undoTimer=setTimeout(()=>{ _undo=null; pintaUndo(); }, 15000);
  pintaUndo();
}
function desfazer(){
  if(!_undo) return;
  CAMPOS_UNDO.forEach(k=>{ if(_undo.antes[k]!==null) S[k]=_undo.antes[k]; });
  const d=_undo.descricao; _undo=null; clearTimeout(_undoTimer);
  save(); paint(); pintaUndo();
  toast('Desfeito: '+d.toLowerCase()+'.');
}
function pintaUndo(){
  let el=document.getElementById('undo');
  if(!_undo){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='undo'; document.body.appendChild(el); }
  el.className='undo';
  el.innerHTML=`<span class="ut">${esc(_undo.descricao)}</span>
    <button class="b sm" id="uGo">Desfazer</button>
    <button class="b sm ux" id="uX" title="dispensar">×</button>`;
  el.querySelector('#uGo').onclick=desfazer;
  el.querySelector('#uX').onclick=()=>{ _undo=null; clearTimeout(_undoTimer); pintaUndo(); };
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&_undo&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    e.preventDefault(); desfazer(); }
});

function toast(msg,big,action){
  const w=document.getElementById('tw'), t=document.createElement('div');
  t.className='ts'+(big?' big':''); t.innerHTML=msg; w.appendChild(t);
  const kill=()=>{t.style.opacity='0';t.style.transition='opacity .35s';setTimeout(()=>t.remove(),350);};
  setTimeout(kill,big?14000:7000);
  t.onclick=()=>{ kill(); if(action) action(); };
}
function setView(v){ view=v; S.view=v; save(); paint(); }
function shift(n){
  if(view==='home') return;
  cur = view==='day'  ? addD(cur,n)
      : view==='week' ? addD(cur,7*n)
      : new Date(cur.getFullYear(),cur.getMonth()+n,1);
  paint();
}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>{cur=TODAY();paint();};
document.getElementById('new').onclick=()=>editor(null,iso(cur),'09:00');
document.getElementById('closeDay').onclick=closeDayModal;
document.getElementById('tomorrow').onclick=tomorrowModal;
document.getElementById('sync').onclick=()=>{ if(sstate==='perm')regrant(); else dataModal(); };
document.getElementById('cloud').onclick=nuvemModal;
document.querySelectorAll('.seg .b').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const map={h:'home',j:'day',w:'week',m:'month'};
  if(map[e.key]) setView(map[e.key]);
  if(e.key==='t'){cur=TODAY();paint();}
  if(e.key==='n') editor(null,iso(cur),'09:00');
  if(e.key==='f') closeDayModal();
  if(e.key==='d') tomorrowModal();

  if(e.key==='ArrowLeft') shift(-1);
  if(e.key==='ArrowRight') shift(1);
  if(e.key==='Escape') shut();
});

const THEMES=['auto','light','dark'];
const THEME_ICON={auto:'◐',light:'☀',dark:'☾'};
const THEME_NAME={auto:'Tema do sistema',light:'Tema claro',dark:'Tema escuro'};
function applyTheme(){
  document.documentElement.dataset.theme=S.theme||'auto';
  const b=document.getElementById('theme');
  if(b){ b.textContent=THEME_ICON[S.theme||'auto']; b.title=THEME_NAME[S.theme||'auto']+' — clique para trocar'; }
}
document.getElementById('theme').onclick=()=>{
  S.theme=THEMES[(THEMES.indexOf(S.theme||'auto')+1)%3]; save(); applyTheme();
  toast(THEME_NAME[S.theme]);
};

function paint(){
  applyTheme();
  const antigo=document.querySelector('.day,.proto,.home,.mo');
  if(antigo) _pageY[view]=antigo.scrollTop;
  document.getElementById('period').textContent = (view==='home')?'':periodLabel();
  document.querySelectorAll('.seg .b').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.getElementById('navGrp').style.display=(view==='home')?'none':'flex';
  document.getElementById('side').style.display = (view==='home'||view==='day'||view==='proto') ? 'none' : '';
  const L=life();
  document.getElementById('hstat').innerHTML=`<b class="num">${L.streak}</b> dias · <b class="num">${Math.round(L.tot/60)}h</b>`;
  if(view==='home') renderHome();
  else if(view==='day') renderDay();
  else if(view==='week') renderWeek();
  else if(view==='month') renderMonth();
  else renderWeek();
  const novo=document.querySelector('.day,.proto,.home,.mo');
  if(novo && _pageY[view]) novo.scrollTop=_pageY[view];
  renderSide(); paintSync(); nagBar(); pintaUndo();
}
ensureRealista(); ensureLevels(); ensureExtras(); ensureOut(); ensureAlertas();
paint(); pomoPaint();
window.addEventListener('load',()=>{ setTimeout(async()=>{
  await cloudInit();
  const q=new URLSearchParams((location.hash||'').replace(/^#/,'')+'&'+location.search.replace(/^\?/,''));
  if(q.get('error')||q.get('error_code')){
    const cod=q.get('error_code')||q.get('error');
    const desc=(q.get('error_description')||'').replace(/\+/g,' ');
    const amigavel = /provider is not enabled|validation_failed/i.test(cod+desc)
      ? 'Esse provedor de login não está habilitado no seu projeto. Use "Receber link por e-mail".'
      : /expired|invalid/i.test(cod+desc)
      ? 'O link expirou ou já foi usado. Peça outro no botão da nuvem.'
      : desc||cod;
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    setTimeout(()=>toast('<b>Não consegui entrar.</b><br>'+esc(amigavel),true,nuvemModal),600);
  }
  const publicado = location.protocol==='https:';
  if(publicado && cloudState==='off' && !S.milestones['convite-nuvem']){
    S.milestones['convite-nuvem']=true; save();
    setTimeout(()=>toast('<b>Site no ar.</b><br>Falta ligar a nuvem para usar no celular com os mesmos dados. Clique aqui.',true,nuvemModal),1500);
  }
},300); });
if('serviceWorker' in navigator) window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const novo=reg.installing; if(!novo) return;
      novo.addEventListener('statechange',()=>{
        if(novo.state==='installed' && navigator.serviceWorker.controller)
          toast('<b>Versão nova disponível.</b><br>Clique para atualizar este aparelho.',true,
            ()=>{ novo.postMessage({tipo:'assumir'}); setTimeout(()=>location.reload(),300); });
      });
    });
    setInterval(()=>reg.update().catch(()=>{}), 300000);
  }).catch(()=>{});
  let recarregou=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(recarregou) return; recarregou=true; location.reload();
  });
}); initFS();

(function greet(){
  const k='g:'+iso(TODAY()); if(S.milestones[k])return;
  S.milestones[k]=true; save();
  const L=life();
  if(notifEstado()==='default') setTimeout(()=>toast('Ative as notificações para receber os avisos de estudo e idioma mesmo trabalhando em outra janela.',true,()=>askNotify()),3000);
  setTimeout(()=>toast(`Bom dia, Felipe. <b>${L.streak}</b> dias de sequência e <b>${Math.round(L.tot/60)}h</b> investidas até aqui.`,true),600);
  askNotify();
})();
setInterval(()=>{
  const n=new Date(), k=iso(TODAY()), m=n.getHours()*60+n.getMinutes();
  if(!S.night||!S.night.on) return;
  const alvo=t2m(S.wake&&S.sleep?S.sleep[n.getDay()]:'21:30')-(S.night.lead||60);
  if(m>=alvo && m<alvo+2 && !S.milestones['nite:'+k]){
    S.milestones['nite:'+k]=true; save(); beep();
    notify('Preparar amanhã','Confira o dia seguinte e escolha o plano antes de dormir.');
    toast('<b>Hora de preparar amanhã.</b><br>Confira os blocos e escolha o plano. Clique aqui para abrir.',true,tomorrowModal);
  }
  if(m>=alvo+2 && m<alvo+4 && !(S.closed||{})[k] && !S.milestones['cls:'+k]){
    S.milestones['cls:'+k]=true; save();
    toast('Não esqueça de fechar o dia de hoje e registrar o que leu.',true,closeDayModal);
  }
},60000);
